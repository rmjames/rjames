name: Weekly Codebase Cleanup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual triggers
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(fromJSON('["trusted-user", "another-user"]'), github.event.issue.user.login)) ||
      (github.event_name == 'issue_comment' && contains(fromJSON('["trusted-user", "another-user"]'), github.event.comment.user.login))
    steps:
      - name: Invoke Jules for Cleanup
        uses: google-labs-code/jules-action@v1
        with:
          prompt: |
            Please analyze the codebase and perform maintenance tasks:

            ## Focus Areas

            1. **Dead Code Removal**
               - Find unused variables, functions, and classes
               - Remove commented-out code blocks
               - Clean up unreachable code paths

            2. **Code Duplication**
               - Identify duplicated code blocks
               - Refactor into reusable functions
               - Apply DRY principles

            3. **Complexity Reduction**
               - Simplify overly complex functions
               - Break down large functions into smaller pieces
               - Reduce nested conditionals

            4. **Naming Improvements**
               - Find unclear variable/function names
               - Apply consistent naming conventions

            5. **Code Formatting**
               - Fix inconsistent indentation
               - Organize imports

            Guidelines:
            - Make incremental, safe refactorings
            - Preserve existing functionality
            - Run tests to verify changes
            - Group related changes logically

            Do not open a PR if you do not have a validated and impactful change.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          include_commit_log: true
          starting_branch: "2023"