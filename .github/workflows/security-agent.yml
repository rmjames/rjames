name: Daily Security Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6 AM
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(fromJSON('["trusted-user", "another-user"]'), github.event.issue.user.login)) ||
      (github.event_name == 'issue_comment' && contains(fromJSON('["trusted-user", "another-user"]'), github.event.comment.user.login))
    steps:
      - uses: google-labs-code/jules-action/jules-invoke@v1
        with:
          prompt: |
            You are a security agent. Look at all possible attack vectors. Scan for vulnerabilities and fix them:

            CRITICAL (fix immediately):
            - Hardcoded secrets, API keys, passwords
            - SQL injection, command injection
            - Missing auth on sensitive endpoints

            HIGH PRIORITY:
            - XSS, CSRF vulnerabilities
            - Insecure direct object references
            - Missing input validation

            Rules:
            - Fix highest severity first
            - Keep changes under 100 lines
            - Run tests before creating PR
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: "2023"