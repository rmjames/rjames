<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Buttons with Custom Properties - A collection of buttons with custom properties and animations" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com data:; img-src 'self' https://assets.codepen.io data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://robertjames.nyc https://www.google-analytics.com https://analytics.google.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; frame-src 'self'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Buttons with Custom Properties</title>
    <style>
        :root {
            --x: 0;
            --y: 0;
            --z: 0;
            --h: 220;
            --s: 25;
            --l: 27;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linen;
            margin: 0;
        }

        button {
            --color: oklch(from hsl(calc(var(--h) l c h) * 1), calc(var(--s) * 1%), calc(var(--l) * 1%));
            --shadow-x: 4px;
            --shadow-y: 5px;
            --shadow-blur: 16px;
            background: transparent;
            padding: 1.1em;
            margin: 1.4em;
            border: .01em solid oklch(from hsla(0, 0%, 90%, .76) l c h);
            outline: none;
            color: var(--color);
            transition: all .244s ease-in-out;
            transform: translate(calc(var(--x) * 1vmin), calc(var(--y) * 1vmin), calc(var(--z) * 1vmin));
            box-shadow: var(--shadow-x) var(--shadow-y) var(--shadow-blur) currentcolor;
            font-size: 4vmin;
            cursor: pointer;
        }

        button:active {
            --shadow-x: 1.3px;
            --shadow-y: 1.27px;
            --shadow-blur: 5.5px;
        }

        button.brown {
            --h: 10;
        }
    </style>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../styles/lab-shared.css">
    <script src="../scripts/favicon-animator.js" async></script>
</head>

<body>
    <a href="../lab.html" class="back-link" aria-label="Back to Labs">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
        <span>Back</span>
    </a>
    <button data-analytics-element="Enter Button">Enter</button>
    <button class="brown" data-analytics-element="Enter Button Brown">Enter</button>
</body>

</html>
