<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' data:; img-src 'self' https://assets.codepen.io __MEDIA_CDN__ data:; media-src 'self' __MEDIA_CDN__ blob: data:; font-src 'self'; connect-src 'self' https://robertjames.nyc __MEDIA_CDN__ https://www.google-analytics.com https://analytics.google.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; frame-src 'self'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Media Player Widget - Labs</title>
    <link rel="stylesheet" href="../styles/components/media-player-inline.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: oklch(0.1 0 0);
            font-family: system-ui, -apple-system, sans-serif;
            color: oklch(from white l c h);
            padding: 2rem;
        }

        .demo-instructions {
            margin-bottom: 2rem;
            text-align: center;
            max-width: 30rem;
        }

        .demo-instructions p {
            color: oklch(0.7 0 0);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #player-mount {
            inline-size: 100%;
            max-inline-size: 40rem;
            display: flex;
            justify-content: center;
        }
    </style>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="modulepreload" href="../scripts/favicon-animator.js">
    <script type="module" src="../scripts/favicon-animator.js" async></script>
</head>

<body>
    <div class="demo-instructions">
        <p>Inline player demo using the shared modular component factory.</p>
    </div>

    <main id="player-mount"></main>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script type="module">
        import { MediaPlayerCore } from '../scripts/media/MediaPlayerCore.js';
        import { buildInlinePlayer } from '../scripts/media/InlinePlayer.js';

        const mount = document.getElementById('player-mount');
        const audio = document.getElementById('audio-player');
        const core = new MediaPlayerCore(audio);

        buildInlinePlayer(mount, core, document);

        if (core.tracks && core.tracks.length > 0) {
            core.loadTrack(0);
        }
    </script>
</body>

</html>
