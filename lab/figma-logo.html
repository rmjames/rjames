    <meta charset="UTF-8">

    <title>Figma Logo</title>
    <style>
        :root {
            --color: oklch(from #000 l c h);
            --dimension: 4.44;
        }

        body {
            color-scheme: dark;
            color: oklch(from #33333a l c h);
            display: grid;
            min-block-size: 100vh;
            background: var(--color);
            margin: 0;
            font-size: 2vmin;
        }

        .icon {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            grid-auto-flow: column;
            margin: auto;

            &>* {
                block-size: calc(var(--dimension) * 1em);
                inline-size: calc(var(--dimension) * 1em);
            }

            & .item {
                --count: 5;
                --i: 1;
                animation: enter calc(.28s * var(--count)) ease-in-out backwards;
                animation-delay: calc(var(--i) * .24s);

                &:nth-child(1) {
                    --i: 1;
                    --color: oklch(from #f24e1e l c h);
                    background: var(--color);
                    border-radius: 50px 0 0 50px;
                }

                &:nth-child(2) {
                    --i: 2;
                    --color: oklch(from #a259ff l c h);
                    background: var(--color);
                    border-radius: 50px 0 0 50px;
                }

                &:nth-child(3) {
                    --i: 3;
                    --color: oklch(from #0acf83 l c h);
                    background: var(--color);
                    border-radius: 50px 0 50px 50px;
                }

                &:nth-child(4) {
                    --i: 4;
                    --color: oklch(from #ff7262 l c h);
                    background: var(--color);
                    border-radius: 0 50px 50px 0;
                }

                &:nth-child(5) {
                    --i: 5;
                    --color: oklch(from #1abcfe l c h);
                    background: var(--color);
                    border-radius: 50%;
                }

                @supports (animation-delay: calc(sibling-index() * 1s)) {
                    animation-duration: calc(.28s * sibling-count());
                    animation-delay: calc(sibling-index() * .24s);
                }
            }
        }

        @keyframes enter {
            from {
                opacity: 0;
                rotate: -16deg;
                scale: .1;
                translate: -1ch 1ch;
            }

            64% {
                opacity: .76;
                rotate: 2deg;
                scale: 1.025;
                translate: 0 0;
            }

            96% {
                opacity: 1;
                rotate: 0deg;
                scale: 1;
                translate: 0 0;
            }
        }

        .reset-btn {
            color: oklch(from #fff l c h);
        }
    </style>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../styles/lab-shared.css">
    <link rel="modulepreload" href="../scripts/favicon-animator.js">
    <script type="module" src="../scripts/favicon-animator.js" async></script>
    <script type="module" src="../scripts/utils/labNavigation.js"></script>
    <script type="module" src="../scripts/lab/figma-logo.js"></script>
</head>

<body>
    <a href="../lab.html" class="back-link" aria-label="Back to Labs">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
        </svg>
        <span>Back</span>
    </a>
    <div class="icon">
        <div class="item arc"></div>
        <div class="item arc"></div>
        <div class="item drop"></div>
        <div class="item arc"></div>
        <div class="item circle"></div>
    </div>
    <button class="reset-btn" data-analytics-element="Reset Animation" aria-label="Replay animation">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor"
            aria-hidden="true">
            <path
                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
    </button>
</body>
