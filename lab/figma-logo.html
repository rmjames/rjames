<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com data:; img-src 'self' https://assets.codepen.io data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; frame-src 'self'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Logo</title>
    <style>
        :root {
            --color: oklch(from #000 l c h);
            --dimension: 4.44;
        }

        body {
            display: grid;
            height: 100vh;
            background: var(--color);
            margin: 0;
            font-size: 2vmin;
        }

        .icon {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            margin: auto;
        }

        .icon>* {
            height: calc(var(--dimension) * 1em);
            width: calc(var(--dimension) * 1em);
        }

        .arc:first-of-type,
        .arc:nth-child(3) {
            --color: oklch(from #f24e1e l c h);
            background: var(--color);
            border-radius: 50px 0 0 50px;
        }

        .arc:nth-child(2) {
            --color: oklch(from #ff7262 l c h);
            background: var(--color);
            border-radius: 0 50px 50px 0;
        }

        .arc:nth-child(3) {
            --color: oklch(from #a259ff l c h);
            background: var(--color)
        }

        .circle {
            --color: oklch(from #1abcfe l c h);
            background: var(--color);
            border-radius: 50%
        }

        .drop {
            --color: oklch(from #0acf83 l c h);
            background: var(--color);
            border-radius: 50px 0 50px 50px
        }
    </style>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../styles/lab-shared.css">
    <script src="../scripts/favicon-animator.js" async></script>
</head>

<body>
    <a href="../lab.html" class="back-link" aria-label="Back to Labs">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
        <span>Back</span>
    </a>
    <div class="icon">
        <div class="arc"></div>
        <div class="arc"></div>
        <div class="arc"></div>
        <div class="circle"></div>
        <div class="drop"></div>
    </div>
</body>

</html>
