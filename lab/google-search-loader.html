<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' data:; img-src 'self' https://assets.codepen.io data:; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; frame-src 'self'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Loader</title>
    <style>
        :root {
            --dur-slow: .35s;
            --dur-const: 2;
            --dur-reg: calc(var(--dur-slow) / var(--dur-const));
            --dur-med: calc(var(--dur-reg) / var(--dur-const));
            --dur-fast: calc(var(--dur-med) / var(--dur-const));
            --item-dimension: .2em;
            --initState: translate3d(-10%, 30%, 0) scale(2.5);
            --initShadow: 0 0 0 0;
            --initShadow: inset 0 .32em 2em oklch(from hsl(0 10% 66% /.8) l c h / .4),
                -1em -.52em 4.5em .1em oklch(from hsl(0 0% 0% /.3) l c h / .2),
                0 1em 3em oklch(from hsl(0 0% 0% /.1) l c h / .1);
            --animation: '';
            --equalizer: equalizer 1.5s ease-in-out forwards;
            --levitate: levitate 1.4s ease-in-out 4 forwards;
        }

        body {
            display: flex;
            justify-content: center;
            margin-top: 10em;
            margin: 0;
            height: 100vh;
            align-items: center;
            background: oklch(.52 0 0 / 0.12);
        }

        .container {
            background: oklch(from hsla(360, 100%, 100%, .9) l c h / .9);
            font-size: 3vmin;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 5.1em;
            width: 5.1em;
            border-radius: 50%;
            box-shadow: var(--initShadow);
            transform: var(--initState);
            transform-style: preserve-3d;
            transition: transform .4s cubic-bezier(.12, .99, .96, .76);
            will-change: transform, box-shadow;
            padding: 0;
            margin: 0;
            contain: layout style paint;
        }

        .item {
            height: var(--item-dimension);
            width: var(--item-dimension);
            background: oklch(from blue l c h);
            margin: .244em;
            padding: .051em;
            border-radius: 50%;
            list-style: none;
            transition: all .3s;
            animation: levitate 1.4s ease-in-out infinite forwards;
        }

        .item:nth-child(1) {
            animation-delay: var(--dur-fast);
        }

        .item:nth-child(2) {
            background: oklch(from red l c h);
            animation-delay: var(--dur-med);
        }

        .item:nth-child(3) {
            background: oklch(from orange l c h);
            animation-delay: var(--dur-reg);
        }

        .item:nth-child(4) {
            background: oklch(from green l c h);
            animation-delay: var(--dur-slow);
        }

        .equalizer {
            animation: equalizer 1.5s ease-in-out forwards,
                levitate 1.5s ease-in-out infinite forwards;
        }

        .talkState {
            --initState: translate3d(calc(50vw - 24vmin), -10em, 0) scale(1.1);
        }

        .reset-btn {
            position: fixed;
            bottom: 4cqi;
            right: 4cqi;
            background: transparent;
            color: oklch(from #33333a l c h / .75);
            border: none;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            opacity: 0.5;
            transition: opacity 0.2s;

            &:hover {
                opacity: 1;
            }
        }

        @keyframes levitate {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(0, .57em);
            }
        }

        @keyframes box-dot--blue {
            10% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(0, 0);
            }

            30% {
                transform: translate();
            }

            40% {
                transform: translate();
            }

            50% {
                transform: translate();
            }

            60% {
                transform: translate();
            }

            70% {
                transform: translate();
            }

            80% {
                transform: translate();
            }

            90% {
                transform: translate();
            }

            100% {
                transform: translate();
            }
        }

        @keyframes box-dot--red {
            10% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(0, 0);
            }

            30% {
                transform: translate();
            }

            40% {
                transform: translate();
            }

            50% {
                transform: translate();
            }

            60% {
                transform: translate();
            }

            70% {
                transform: translate();
            }

            80% {
                transform: translate();
            }

            90% {
                transform: translate();
            }

            100% {
                transform: translate();
            }
        }

        @keyframes box-dot--orange {
            10% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(-.1em, -.15em);
            }

            30% {
                transform: translate();
            }

            40% {
                transform: translate();
            }

            50% {
                transform: translate();
            }

            60% {
                transform: translate();
            }

            70% {
                transform: translate();
            }

            80% {
                transform: translate();
            }

            90% {
                transform: translate();
            }

            100% {
                transform: translate();
            }
        }

        @keyframes box-dot--green {
            10% {
                transform: translate(-.1em, .16em);
            }

            20% {
                transform: translate(-.3em, .7em);
            }

            30% {
                transform: translate();
            }

            40% {
                transform: translate();
            }

            50% {
                transform: translate();
            }

            60% {
                transform: translate();
            }

            70% {
                transform: translate();
            }

            80% {
                transform: translate();
            }

            90% {
                transform: translate();
            }

            100% {
                transform: translate();
            }
        }

        @keyframes rotate {
            to {
                transform: rotate(1turn)
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(.3);
            }

            50% {
                transform: scale(1.2);
            }
        }

        @keyframes colorShift {
            0% {
                background: oklch(from hsla(10, 80%, 79%, .4) l c h / .4);
            }

            50% {
                background: oklch(from orange l c h);
            }

            100% {
                background: oklch(from hsla(50, 80%, 79%, .5) l c h / .5);
            }
        }

        @keyframes equalizer {
            0% {
                height: 3em;
            }

            10% {
                height: 2.72em;
            }

            20% {
                height: .2em;
            }

            30% {
                height: 1.7em;
            }

            40% {
                height: 2em;
            }

            50% {
                height: 3.2em;
            }

            60% {
                height: .5em;
            }

            70%,
            90% {
                height: 1.5em;
            }

            80% {
                height: 2.5em;
            }

            100% {
                height: var(--item-dimension);
            }
        }
    </style>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../styles/lab-shared.css">
    <script src="../scripts/favicon-animator.js" async></script>
</head>

<body>
    <a href="../lab.html" class="back-link" aria-label="Back to Labs">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
        <span>Back</span>
    </a>
    <ul class="container">
        <li class="item"></li>
        <li class="item"></li>
        <li class="item"></li>
        <li class="item"></li>
    </ul>

    <button class="reset-btn" data-analytics-element="Reset Animation" onclick="resetAnimation()">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor">
            <path
                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
    </button>

    <script>
        const container = document.querySelector('.container'),
            dot = document.querySelector('.item'),
            dots = document.querySelectorAll('.item'),
            aniDotGreen = 'box-dot--green 1s ease-in';

        const load = () => {
            setTimeout(() => {
                Promise.resolve(container.classList.add('talkState'));
            }, 3700
            );
        };

        load();

        container.addEventListener('click', () => {
            dots.forEach(dot => { dot.classList.toggle('equalizer') })
        })

        function resetAnimation() {
            const elements = document.querySelectorAll('.item');
            elements.forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight; /* trigger reflow */
                el.style.animation = null;
            });
        }
    </script>
</body>

</html>
