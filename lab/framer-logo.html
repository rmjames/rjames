<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy"

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framer Logo</title>
    <style>
        :root {
            --color: oklch(from #8DF l c h);
            --triangle: polygon(100% 0%, 100% 100%, 0% 0%);
            --dimension: 9;
        }

        body {
            background: oklch(from #000 l c h);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-size: 2vmin;
        }

        .polygon {
            height: calc(var(--dimension) * 1em);
            width: calc(var(--dimension) * 1em);
            --dimension: 3;
            position: relative;
            background: var(--color);
        }

        .polygon:nth-child(2) {
            --color: oklch(from #09F l c h);
            background: var(--color);
        }

        .polygon:nth-child(3) {
            --color: oklch(from #05F l c h);
            background: var(--color);
            clip-path: var(--triangle);
            transform: translate(-3em, 0);
        }

        .top:before,
        .mid:before {
            height: calc(var(--dimension) * 1em);
            width: calc(var(--dimension) * 1em);
            --dimension: 3;
            content: '';
            position: absolute;
            top: 0;
            clip-path: var(--triangle);
            transform: translate(-3em, 0);
            background: inherit;
        }

        .mid {
            transform: translate(-3em, 0);
        }

        .mid:before {
            transform: translate(3em, 0);
            clip-path: polygon(0% 0%, 100% 100%, 0% 100%);
        }
    </style>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../styles/lab-shared.css">
    <script src="../scripts/favicon-animator.js" async></script>
</head>

<body>
    <a href="../lab.html" class="back-link" aria-label="Back to Labs">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
        <span>Back</span>
    </a>
    <section class='icon'>
        <div class='polygon top'></div>
        <div class='polygon mid'></div>
        <div class='polygon bottom'></div>
    </section>
</body>
