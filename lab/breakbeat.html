<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self';">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreakBeat - Technics SL-1210MK2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: lch(24% 0 0);
      font-family: sans-serif;
    }

    svg {
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      border-radius: 15px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --white-0: lch(100% 0 0);
      --gray-0: lch(85.12% 0 0);
      --gray-1: lch(83.13% 0 0);
      --gray-2: lch(17.88% 0 0);
      --black-0: lch(14.85% 0 0);
      --crate-scale: 1;
    }

    /* Milk Crate Library Styles */
    #library-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 20;
      display: none;
      padding: 40px;
      overflow: hidden;
      backdrop-filter: blur(15px);
      box-sizing: border-box;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 20px auto;
      color: var(--white-0);
      font-family: sans-serif;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--gray-0);
      font-size: 30px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--white-0);
    }

    .library-container {
      display: flex;
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
      height: calc(100% - 60px);
      align-items: stretch;
    }

    .crate-section {
      flex: 1.3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
    }

    /* 3D Records Stack Wrapper */
    .crate-records-wrapper {
      width: calc(480px * var(--crate-scale));
      height: calc(240px * var(--crate-scale));
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      transition: width 0.3s ease, height 0.3s ease;
    }

    #crate-records-container {
      position: relative;
      width: 480px;
      height: 240px;
      perspective: 1000px;
      transform-style: preserve-3d;
      transform: scale(var(--crate-scale));
      transform-origin: center center;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .crate-record {
      position: absolute;
      width: 200px;
      height: 200px;
      left: calc(50% - 100px);
      bottom: 0;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s, z-index 0.1s;
      cursor: pointer;
      box-sizing: border-box;
      border: 3px solid lch(12% 0 0);
      background: lch(15% 0 0);
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transform-origin: bottom center;
    }

    .crate-record-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .crate-record:hover {
      filter: brightness(1.15);
    }


    .crate-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 25px;
    }

    .crate-nav-btn {
      background: lch(25% 0 0);
      color: var(--white-0);
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .crate-nav-btn:hover {
      background: lch(35% 0 0);
    }

    .crate-nav-btn:active {
      transform: scale(0.95);
    }

    #crate-counter {
      color: var(--gray-0);
      font-family: monospace;
      font-size: 14px;
    }

    /* Album Details Sidebar */
    .details-section {
      flex: 0.9;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 30px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      backdrop-filter: blur(5px);
      contain: layout paint style;
    }

    .details-card-container {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* Vinyl Slide-out Container */
    .sleeve-preview-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 20px auto;
    }

    .sleeve-preview-img {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      object-fit: cover;
      z-index: 2;
      transition: transform 0.4s ease;
    }

    .sleeve-preview-container.active .sleeve-preview-img {
      transform: translateX(-40px);
    }

    .vinyl-disc-anim {
      position: absolute;
      width: 94%;
      height: 94%;
      top: 3%;
      left: 3%;
      border-radius: 50%;
      background: radial-gradient(circle, #333 4%, #0f0f0f 5%, #000000 15%, #1c1c1c 25%, #050505 45%, #000 100%);
      z-index: 1;
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
    }

    .sleeve-preview-container.active .vinyl-disc-anim {
      transform: translateX(45px) rotate(180deg);
    }

    .vinyl-disc-anim::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }

    .vinyl-label-center {
      position: absolute;
      width: 60px;
      height: 60px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #111;
      border: 2px solid #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-label-center img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .details-track-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .details-track-item {
      color: var(--gray-0);
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: monospace;
      font-size: 13.5px;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: vt-slide-fade-in 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .details-track-item:nth-child(1) {
      animation-delay: 0.20s;
    }

    .details-track-item:nth-child(2) {
      animation-delay: 0.24s;
    }

    .details-track-item:nth-child(3) {
      animation-delay: 0.28s;
    }

    .details-track-item:nth-child(4) {
      animation-delay: 0.32s;
    }

    .details-track-item:nth-child(5) {
      animation-delay: 0.36s;
    }

    .details-track-item:nth-child(6) {
      animation-delay: 0.40s;
    }

    .details-track-item:nth-child(7) {
      animation-delay: 0.44s;
    }

    .details-track-item:nth-child(8) {
      animation-delay: 0.48s;
    }

    @supports (animation-delay: calc(sibling-index() * 1s)) {
      .details-track-item {
        animation-delay: calc(0.16s + sibling-index() * 0.04s);
      }
    }

    .details-track-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      color: var(--white-0);
      transform: translateX(3px);
    }

    .details-track-item.playing {
      background: lch(20% 5 240);
      border-color: lch(35% 5 240);
      color: var(--white-0);
      font-weight: bold;
    }

    .details-track-item.playing::after {
      content: '⚡';
      font-size: 11px;
      color: lch(80% 100 90);
    }

    /* Mini Milk Crate Button Styles */
    .mini-crate-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      outline: none;
      z-index: 5;
    }

    .mini-records-spread {
      position: relative;
      width: 60px;
      height: 48px;
      transition: transform 0.2s ease;
    }

    .mini-record-card {
      position: absolute;
      width: 32px;
      height: 32px;
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform-style: preserve-3d;
      perspective: 400px;
    }

    .card-one {
      left: 4px;
      top: 4px;
      z-index: 1;
    }

    .card-two {
      left: 12px;
      top: 10px;
      z-index: 2;
    }

    .card-three {
      left: 16px;
      top: 16px;
      z-index: 3;
    }

    .mini-jacket {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 2;
      transform: translateZ(2px);
    }

    .card-one .mini-jacket {
      background: linear-gradient(135deg, lch(54.36% 46.13 25.47), lch(36.58% 76.95 38.3));
    }

    .card-two .mini-jacket {
      background: linear-gradient(135deg, lch(78.54% 52.3 104.42), lch(81.25% 82.4 100.76));
    }

    .card-three .mini-jacket {
      background: linear-gradient(135deg, lch(57.31% 68.72 136.35), lch(39.27% 58.7 138.66));
    }

    .mini-vinyl {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #000 12%, transparent 12.5%),
        radial-gradient(circle, var(--label-color, #fdd835) 35%, transparent 35.5%),
        conic-gradient(from 0deg, #111, #2a2a2d 25%, #111 50%, #2a2a2d 75%, #111);
      box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.5);
      z-index: 1;
      transform: translate3d(0, 0, 0);
      transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card-one .mini-vinyl {
      --label-color: #fdd835;
    }

    .card-two .mini-vinyl {
      --label-color: #ff4081;
    }

    .mini-crate-label {
      color: var(--white-0);
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
      letter-spacing: 1.5px;
      transition: all 0.2s ease;
      background: rgba(0, 0, 0, 0.7);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 6px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
      display: inline-block;
    }

    /* Interactive hover effects */
    .mini-crate-button:hover .card-one {
      transform: translateY(-8px) rotate(-10deg);
    }

    .mini-crate-button:hover .card-two {
      transform: translateY(-6px) rotate(8deg);
      left: 24px;
    }

    .mini-crate-button:hover .mini-vinyl {
      transform: translate3d(14px, 0, -1px) rotate(180deg);
    }

    .mini-crate-button:hover .mini-records-spread {
      transform: translateY(-2px);
    }

    .mini-crate-button:hover .mini-crate-label {
      color: #38ef7d;
    }

    .mini-crate-button:active .mini-records-spread {
      transform: translateY(1px);
    }

    /* --- View Transitions for Record Library --- */

    .modal-header {
      view-transition-name: lib-header;
    }

    .crate-section {
      view-transition-name: lib-crate-section;
    }

    .details-section {
      view-transition-name: lib-details-section;
    }

    /* Assign names to first 8 sleeves in HTML dynamically or via CSS */
    .crate-record:nth-child(1) {
      view-transition-name: record-sleeve-1;
    }

    .crate-record:nth-child(2) {
      view-transition-name: record-sleeve-2;
    }

    .crate-record:nth-child(3) {
      view-transition-name: record-sleeve-3;
    }

    .crate-record:nth-child(4) {
      view-transition-name: record-sleeve-4;
    }

    .crate-record:nth-child(5) {
      view-transition-name: record-sleeve-5;
    }

    .crate-record:nth-child(6) {
      view-transition-name: record-sleeve-6;
    }

    .crate-record:nth-child(7) {
      view-transition-name: record-sleeve-7;
    }

    .crate-record:nth-child(8) {
      view-transition-name: record-sleeve-8;
    }

    /* Assign names to first 8 track list items */
    .details-track-item:nth-child(1) {
      view-transition-name: track-item-1;
    }

    .details-track-item:nth-child(2) {
      view-transition-name: track-item-2;
    }

    .details-track-item:nth-child(3) {
      view-transition-name: track-item-3;
    }

    .details-track-item:nth-child(4) {
      view-transition-name: track-item-4;
    }

    .details-track-item:nth-child(5) {
      view-transition-name: track-item-5;
    }

    .details-track-item:nth-child(6) {
      view-transition-name: track-item-6;
    }

    .details-track-item:nth-child(7) {
      view-transition-name: track-item-7;
    }

    .details-track-item:nth-child(8) {
      view-transition-name: track-item-8;
    }

    /* Animation Keyframes */
    @keyframes vt-slide-fade-in {
      from {
        filter: blur(5px);
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      to {
        filter: blur(0);
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes vt-slide-fade-out {
      from {
        filter: blur(0);
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        filter: blur(5px);
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
    }

    @keyframes vt-slide-in-right {
      from {
        opacity: 0;
        transform: translateX(45px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes vt-slide-out-right {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(45px);
      }
    }

    @keyframes vt-slide-in-left {
      from {
        opacity: 0;
        transform: translateX(-45px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes vt-slide-out-left {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(-45px);
      }
    }

    /* Disable default group morphing animations for our staggered elements */
    ::view-transition-group(lib-header),
    ::view-transition-group(lib-crate-section),
    ::view-transition-group(lib-details-section),
    ::view-transition-group(record-sleeve-1),
    ::view-transition-group(record-sleeve-2),
    ::view-transition-group(record-sleeve-3),
    ::view-transition-group(record-sleeve-4),
    ::view-transition-group(record-sleeve-5),
    ::view-transition-group(record-sleeve-6),
    ::view-transition-group(record-sleeve-7),
    ::view-transition-group(record-sleeve-8),
    ::view-transition-group(track-item-1),
    ::view-transition-group(track-item-2),
    ::view-transition-group(track-item-3),
    ::view-transition-group(track-item-4),
    ::view-transition-group(track-item-5),
    ::view-transition-group(track-item-6),
    ::view-transition-group(track-item-7),
    ::view-transition-group(track-item-8) {
      animation: none;
    }

    /* Custom staggered animations for entrance */
    ::view-transition-new(lib-header) {
      animation: vt-slide-fade-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    ::view-transition-new(lib-crate-section) {
      animation: vt-slide-in-left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    ::view-transition-new(lib-details-section) {
      animation: vt-slide-in-right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* Staggered entrance for record sleeves inside the crate */
    ::view-transition-new(record-sleeve-1) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.10s;
    }

    ::view-transition-new(record-sleeve-2) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.13s;
    }

    ::view-transition-new(record-sleeve-3) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.16s;
    }

    ::view-transition-new(record-sleeve-4) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.19s;
    }

    ::view-transition-new(record-sleeve-5) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.22s;
    }

    ::view-transition-new(record-sleeve-6) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.25s;
    }

    ::view-transition-new(record-sleeve-7) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.28s;
    }

    ::view-transition-new(record-sleeve-8) {
      animation: vt-slide-fade-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.31s;
    }

    /* Staggered entrance for track list items inside the sidebar */
    ::view-transition-new(track-item-1) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.20s;
    }

    ::view-transition-new(track-item-2) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.24s;
    }

    ::view-transition-new(track-item-3) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.28s;
    }

    ::view-transition-new(track-item-4) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.32s;
    }

    ::view-transition-new(track-item-5) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.36s;
    }

    ::view-transition-new(track-item-6) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.40s;
    }

    ::view-transition-new(track-item-7) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.44s;
    }

    ::view-transition-new(track-item-8) {
      animation: vt-slide-fade-in 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.48s;
    }

    /* Custom staggered animations for exit (reversing the entry) */
    html.cls-closing::view-transition-old(lib-header) {
      animation: vt-slide-fade-out 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.25s;
    }

    html.cls-closing::view-transition-old(lib-crate-section) {
      animation: vt-slide-out-left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.15s;
    }

    html.cls-closing::view-transition-old(lib-details-section) {
      animation: vt-slide-out-right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.15s;
    }

    /* Staggered exit for record sleeves inside the crate (reverse order) */
    html.cls-closing::view-transition-old(record-sleeve-1) {
      animation: vt-slide-fade-out 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.21s;
    }

    html.cls-closing::view-transition-old(record-sleeve-2) {
      animation: vt-slide-fade-out 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.18s;
    }

    html.cls-closing::view-transition-old(record-sleeve-3) {
      animation: vt-slide-fade-out 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.15s;
    }

    html.cls-closing::view-transition-old(record-sleeve-4) {

<body>
  <svg viewBox="0 0 800 650" width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <defs>

          <feSpotLight x='-900' y='-900' z='50' pointsAtX='0' pointsAtY='0' pointsAtZ='10' limitingConeAngle='5' />

        <!-- Mask highlight to the circle's shape to prevent overflow -->
        <feComposite in='spec-1' in2='SourceAlpha' operator='in' result='spec-masked' />

      </filter>

      <!-- Red glow for strobe -->

      <filter id="chrome-metallic" x="-50%" y="-50%" width="200%" height="200%">

          lighting-color="#ffffff" result="specular">
          <feDistantLight azimuth="225" elevation="60" />
        </feSpecularLighting>
        <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-masked" />
        <feBlend in="SourceGraphic" in2="specular-masked" mode="screen" result="lit" />
        <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.8" specularExponent="90"
          lighting-color="#ffffff" result="specular-sharp">
          <feDistantLight azimuth="225" elevation="65" />
        </feSpecularLighting>
        <feComposite in="specular-sharp" in2="SourceAlpha" operator="in" result="specular-sharp-masked" />
        <feBlend in="lit" in2="specular-sharp-masked" mode="screen" />
      </filter>

      <filter id="matte-black" x="-50%" y="-50%" width="200%" height="200%">

            style="margin: 0 0 25px 0; color: var(--gray-0); text-align: center; font-style: italic;">Artist Name</p>

          <h4
            style="color: var(--white-0); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin: 0 0 15px 0; font-family: monospace; letter-spacing: 1px; font-size: 12px; text-transform: uppercase;">
            Tracks</h4>
          <ul class="details-track-list" id="details-track-list">
            <!-- Tracks injected here -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div id="loading"
    style="position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--white-0); font-family: sans-serif; font-size: 24px; z-index: 10;">
    <div>Loading Audio Buffer...</div>
    <div style="font-size: 14px; color: var(--gray-0); margin-top: 10px;">Decoding high-quality vinyl scratch assets
    </div>
  </div>

  <script type="module">
    import { TurntableController } from '../scripts/lab/TurntableController.js';
    import { audioLibrary } from '../scripts/AudioLibrary.js';

    const fallbackCover = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100%" height="100%" fill="%231a1a1a"/><circle cx="50" cy="50" r="40" fill="%230d0d0d"/><circle cx="50" cy="50" r="15" fill="%23333333"/><circle cx="50" cy="50" r="2" fill="%23ffffff"/></svg>';

    const controller = new TurntableController();

    const tracks = audioLibrary.tracks;
    const defaultTrack = tracks.find(t => t.title.includes('Nothing Like This')) || tracks[0];
    const defaultFile = defaultTrack ? defaultTrack.src : '../assets/audio/J. Dilla - Ruff Draft - 2007/04 - Nothing Like This.mp3';
    const defaultCover = defaultTrack ? (defaultTrack.albumArt || fallbackCover) : '../assets/audio/J. Dilla - Ruff Draft - 2007/cover.svg';

    controller.initAudio(defaultFile);

    const labelImage = document.getElementById('record-label-image');
    if (labelImage && defaultCover) {
      labelImage.setAttribute('href', defaultCover);
    }

    const libraryModal = document.getElementById('library-modal');
    const btnLibrary = document.getElementById('btn-library');
    const closeLibrary = document.getElementById('close-library');

    // Group tracks into albums dynamically using a Map
    const albumsMap = new Map();
    tracks.forEach(track => {
      const key = `${track.artist} - ${track.album}`;
      if (!albumsMap.has(key)) {
        albumsMap.set(key, {
          artist: track.artist || 'Unknown Artist',
          album: track.album || 'Unknown Album',
          cover: track.albumArt || fallbackCover,
          tracks: []
        });
      }
      let cleanTitle = track.title;
      cleanTitle = cleanTitle.replace(/^\d+[\s.-]*/, '').trim();

      albumsMap.get(key).tracks.push({
        file: track.src,
        title: cleanTitle
      });
    });

    const albums = Array.from(albumsMap.values());
    let activeAlbumIndex = 0;
    let currentPlayingFile = defaultFile;

    // Find the album index containing the default track to show initially
    if (defaultTrack) {
      const defaultAlbumIndex = albums.findIndex(a => a.artist === defaultTrack.artist && a.album === defaultTrack.album);
      if (defaultAlbumIndex !== -1) {
        activeAlbumIndex = defaultAlbumIndex;
      }
    }

    const crateRecordsContainer = document.getElementById('crate-records-container');
    const detailsCover = document.getElementById('details-cover');
    const detailsVinylLabel = document.getElementById('details-vinyl-label');
    const detailsTitle = document.getElementById('details-title');
    const detailsArtist = document.getElementById('details-artist');
    const detailsTrackList = document.getElementById('details-track-list');
    const sleevePreview = document.getElementById('sleeve-preview');
    const crateCounter = document.getElementById('crate-counter');

    // Render sleeves into the crate
    albums.forEach((album, idx) => {
      const recordDiv = document.createElement('div');
      recordDiv.className = 'crate-record';
      recordDiv.dataset.index = idx;

      const img = document.createElement('img');
      img.src = album.cover;
      img.className = 'crate-record-img';
      img.alt = `${album.album} Cover`;
      img.loading = 'lazy';

      recordDiv.appendChild(img);
      crateRecordsContainer.appendChild(recordDiv);

      // Click record to select it
      recordDiv.addEventListener('click', () => {
        if (activeAlbumIndex !== idx) {
          activeAlbumIndex = idx;
          updateCrateView();
        }
      });
    });

    function updateCrateView() {
      const records = crateRecordsContainer.querySelectorAll('.crate-record');

      // Update crate counter
      crateCounter.textContent = `${activeAlbumIndex + 1} / ${albums.length}`;

      records.forEach((record, idx) => {
        const diff = idx - activeAlbumIndex;
        let transform = '';
        let zIndex = 0;
        let opacity = 1;

        if (diff < 0) {
          // Leaning forward (flipped to the left/front)
          transform = `translateX(${diff * 14 - 25}px) translateY(10px) rotateZ(-10deg) scale(0.9)`;
          zIndex = 10 + idx;
          opacity = Math.max(0.3, 1 - Math.abs(diff) * 0.2);
        } else if (diff === 0) {
          // Selected record - pulled up
          transform = `translateX(0px) translateY(-90px) rotateZ(0deg) scale(1.08)`;
          zIndex = 100;
          opacity = 1;
        } else {
          // Leaning backward (stacked in the right/back)
          transform = `translateX(${diff * 14 + 25}px) translateY(18px) rotateZ(10deg) scale(0.9)`;
          zIndex = 100 - diff;
          opacity = Math.max(0.3, 1 - diff * 0.2);
        }

        record.style.transform = transform;
        record.style.zIndex = zIndex;
        record.style.opacity = opacity;
      });

      // Update sidebar details
      const activeAlbum = albums[activeAlbumIndex];
      if (activeAlbum) {
        // Slide vinyl back in first, then slide it out for the new album
        sleevePreview.classList.remove('active');

        setTimeout(() => {
          detailsCover.src = activeAlbum.cover;
          detailsVinylLabel.src = activeAlbum.cover;
          detailsTitle.textContent = activeAlbum.album;
          detailsArtist.textContent = activeAlbum.artist;

          // Render tracklist
          detailsTrackList.innerHTML = '';
          activeAlbum.tracks.forEach(track => {
            const trackLi = document.createElement('li');
            trackLi.className = `details-track-item ${track.file === currentPlayingFile ? 'playing' : ''}`;
            trackLi.innerHTML = `<span>${track.title}</span>`;
            trackLi.dataset.file = track.file;
            trackLi.dataset.cover = activeAlbum.cover;

            trackLi.addEventListener('click', () => {
              // Highlight selected
              detailsTrackList.querySelectorAll('.details-track-item').forEach(item => item.classList.remove('playing'));
              trackLi.classList.add('playing');

              currentPlayingFile = track.file;

              // Load to turntable
              labelImage.setAttribute('href', activeAlbum.cover);


              controller.initAudio(track.file);

              // Close library modal
              toggleLibrary(false);
            });

            detailsTrackList.appendChild(trackLi);
          });

          // Slide vinyl out
          sleevePreview.classList.add('active');
        }, 150);
      }
    }

    // Prev / Next buttons
    document.getElementById('btn-prev-album').addEventListener('click', () => {
      if (activeAlbumIndex > 0) {
        activeAlbumIndex--;
        updateCrateView();
      }
    });

    document.getElementById('btn-next-album').addEventListener('click', () => {
      if (activeAlbumIndex < albums.length - 1) {
        activeAlbumIndex++;
        updateCrateView();
      }
    });

    // Keyboard support: Left/Right arrows to flip through records in crate
    document.addEventListener('keydown', (e) => {
      if (libraryModal.style.display === 'block') {
        if (e.key === 'ArrowLeft') {
          if (activeAlbumIndex > 0) {
            activeAlbumIndex--;
            updateCrateView();
          }
        } else if (e.key === 'ArrowRight') {
          if (activeAlbumIndex < albums.length - 1) {
            activeAlbumIndex++;
            updateCrateView();
          }
        }
      }
    });

    updateCrateView();


    // Modal Toggles with View Transitions
    const toggleLibrary = (isOpen) => {
      if (document.startViewTransition) {
        if (!isOpen) {
          document.documentElement.classList.add('cls-closing');
        }
        const transition = document.startViewTransition(() => {
          libraryModal.style.display = isOpen ? 'block' : 'none';
        });
        if (!isOpen) {
          transition.finished.finally(() => {
            document.documentElement.classList.remove('cls-closing');
          });
        }
      } else {
        libraryModal.style.display = isOpen ? 'block' : 'none';
      }
    };

    btnLibrary.addEventListener('click', () => {
      toggleLibrary(true);
    });
    closeLibrary.addEventListener('click', () => {
      toggleLibrary(false);
    });
    libraryModal.addEventListener('click', (e) => {
      if (e.target === libraryModal) {
        toggleLibrary(false);
      }
    });
  </script>
</body>

</html>
