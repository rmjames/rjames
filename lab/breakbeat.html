<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self';">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreakBeat - Technics SL-1210MK2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: lch(10% 0 0);
      font-family: sans-serif;
    }

    svg {
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      border-radius: 15px;
    }

    :root {
      --white-0: lch(100% 0 0);
      --gray-0: lch(85.12% 0 0);
      --gray-1: lch(83.13% 0 0);
      --gray-2: lch(17.88% 0 0);
      --black-0: lch(14.85% 0 0);
    }
  </style>
</head>

<body>
  <svg viewBox="0 0 800 650" width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Spotlight for the record -->
      <filter id='spotlight'>
        <feGaussianBlur stdDeviation='24' result='blur-1' />
        <feSpecularLighting result='spec-1' in='blur-1' specularExponent='16' lighting-color='lch(96% 0 0 / .2)'>
          <feSpotLight x='-900' y='-900' z='50' pointsAtX='0' pointsAtY='0' pointsAtZ='10' limitingConeAngle='5' />
        </feSpecularLighting>

        <!-- Mask highlight to the circle's shape to prevent overflow -->
        <feComposite in='spec-1' in2='SourceAlpha' operator='in' result='spec-masked' />
        <feComposite in='SourceGraphic' in2='spec-masked' operator='arithmetic' k1='0' k2='1' k3='1' k4='0' />
      </filter>

      <!-- Red glow for strobe -->
      <filter id='red-glow' x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation='3' result='blur' />
        <feComposite in='SourceGraphic' in2='blur' operator='over' />
      </filter>

      <!-- Record Gradient -->
      <radialGradient color-interpolation="linearRGB" id="record">
        <stop offset="0%" stop-color="var(--gray-0)" />
        <stop offset="2%" stop-color="var(--gray-0)" />

        <stop offset="2%" stop-color="var(--white-0)" />
        <stop offset="10%" stop-color="var(--white-0)" />

        <stop offset="10%" stop-color="var(--gray-1)" />
        <stop offset="10.5%" stop-color="var(--gray-1)" />

        <stop offset="10.5%" stop-color="var(--white-0)" />
        <stop offset="30%" stop-color="var(--white-0)" />

        <stop offset="30%" stop-color="var(--black-0)" />
        <stop offset="42%" stop-color="var(--black-0)" />
        <stop offset="42%" stop-color="var(--gray-2)" />

        <stop offset="52%" stop-color="var(--gray-2)" />
        <stop offset="52%" stop-color="var(--black-0)" />
        <stop offset="52.5%" stop-color="var(--black-0)" />
        <stop offset="52.5%" stop-color="var(--gray-2)" />

        <stop offset="64%" stop-color="var(--gray-2)" />
        <stop offset="64%" stop-color="var(--black-0)" />
        <stop offset="64.5%" stop-color="var(--black-0)" />
        <stop offset="64.5%" stop-color="var(--gray-2)" />

        <stop offset="76%" stop-color="var(--gray-2)" />
        <stop offset="76%" stop-color="var(--black-0)" />
        <stop offset="76.5%" stop-color="var(--black-0)" />
        <stop offset="76.5%" stop-color="var(--gray-2)" />

        <stop offset="88%" stop-color="var(--gray-2)" />
        <stop offset="88.5%" stop-color="var(--black-0)" />
        <stop offset="88.5%" stop-color="var(--black-0)" />
        <stop offset="88.5%" stop-color="var(--gray-2)" />

        <stop offset="98%" stop-color="var(--gray-2)" />
        <stop offset="98%" stop-color="var(--black-0)" />
        <stop offset="100%" stop-color="var(--black-0)" />
      </radialGradient>
    </defs>

    <!-- Turntable Base -->
    <rect x="0" y="0" width="800" height="650" rx="15" fill="var(--black-0)" stroke="lch(25% 0 0)" stroke-width="2" />
    <rect x="20" y="20" width="760" height="610" rx="10" fill="lch(12% 0 0)" />

    <!-- 45 Adapter -->
    <g transform="translate(80, 80)">
      <circle cx="0" cy="0" r="32" fill="var(--black-0)" />
      <circle cx="0" cy="0" r="28" fill="var(--gray-2)" />
      <circle cx="0" cy="0" r="22" fill="var(--gray-0)" />
      <circle cx="0" cy="0" r="8" fill="var(--black-0)" />
    </g>

    <!-- Power Switch & Strobe -->
    <g id="power-switch" style="cursor: pointer;" transform="translate(80, 480)">
      <!-- Base -->
      <circle cx="0" cy="0" r="32" fill="var(--black-0)" />

      <!-- Strobe tower -->
      <g transform="translate(22, -18) rotate(-30)">
        <rect x="-12" y="-15" width="24" height="30" rx="2" fill="var(--black-0)" />
        <!-- Red Light -->
        <rect id="strobe-red-light" x="10" y="-8" width="3" height="16" rx="1.5" fill="lch(20% 50 45)" />
        <rect id="strobe-white-light" x="10" y="-8" width="3" height="16" rx="1.5" fill="var(--white-0)" opacity="0.1" />
      </g>

      <!-- Power Dial -->
      <g id="power-dial" style="transform-origin: 0px 0px; transition: transform 0.2s;">
        <circle cx="0" cy="0" r="24" fill="var(--gray-2)" />
        <!-- Dial grip dots -->
        <circle cx="0" cy="0" r="23" fill="none" stroke="var(--gray-0)" stroke-width="1.5" stroke-dasharray="2 4" />

        <!-- Top surface -->
        <circle cx="0" cy="0" r="21" fill="var(--black-0)" />

        <!-- Indicator mark -->
        <circle cx="-13" cy="9" r="1.5" fill="var(--gray-0)" />
      </g>

      <!-- Text and arrows -->
      <path d="M -10 -9 Q 0 -14 10 -9" fill="none" stroke="var(--gray-0)" stroke-width="1" />
      <path d="M -10 -9 L -6 -10 M -10 -9 L -9 -5" fill="none" stroke="var(--gray-0)" stroke-width="1" />
      <path d="M 10 -9 L 6 -10 M 10 -9 L 9 -5" fill="none" stroke="var(--gray-0)" stroke-width="1" />

      <text x="-14" y="-1" font-size="6" fill="var(--white-0)" text-anchor="middle">off</text>
      <text x="14" y="-1" font-size="6" fill="var(--white-0)" text-anchor="middle">on</text>
      <text x="0" y="14" font-size="6" fill="var(--gray-0)" text-anchor="middle">power</text>
    </g>

    <!-- Start/Stop Button -->
    <g transform="translate(40, 560)" id="start-stop-btn" style="cursor: pointer;">
      <rect x="0" y="0" width="80" height="60" rx="2" fill="var(--black-0)" />
      <rect x="5" y="5" width="70" height="50" rx="4" fill="var(--gray-0)" stroke="var(--gray-1)" stroke-width="2" />
      <text x="40" y="30" font-size="10" fill="var(--black-0)" text-anchor="middle" dominant-baseline="middle"
        font-weight="bold">start - stop</text>
    </g>

    <!-- 33 / 45 Buttons -->
    <g transform="translate(135, 595)">
      <!-- 33 Base -->
      <g id="btn-33" style="cursor: pointer;">
        <rect x="0" y="0" width="46" height="22" rx="2" fill="var(--black-0)" />
        <rect id="btn-33-cap" x="2" y="2" width="42" height="18" rx="2" fill="var(--gray-0)" />
        <text x="16" y="12" font-size="10" fill="var(--black-0)" text-anchor="middle" dominant-baseline="middle"
          font-weight="bold">33</text>
        <rect id="btn-33-led" x="30" y="9" width="8" height="4" rx="1" fill="var(--black-0)" />
      </g>

      <!-- 45 Base -->
      <g id="btn-45" style="cursor: pointer;">
        <rect x="48" y="0" width="46" height="22" rx="2" fill="var(--black-0)" />
        <rect id="btn-45-cap" x="50" y="2" width="42" height="18" rx="2" fill="var(--gray-0)" />
        <text x="64" y="12" font-size="10" fill="var(--black-0)" text-anchor="middle" dominant-baseline="middle"
          font-weight="bold">45</text>
        <rect id="btn-45-led" x="78" y="9" width="8" height="4" rx="1" fill="var(--black-0)" />
      </g>
    </g>

    <!-- Platter Base & Strobe Dots -->
    <g transform="translate(330, 310)">
      <!-- Platter shadow -->
      <circle cx="5" cy="10" r="265" fill="lch(5% 0 0 / .5)" />

      <!-- Platter rim -->
      <circle cx="0" cy="0" r="265" fill="var(--gray-2)" />
      <circle cx="0" cy="0" r="260" fill="var(--black-0)" />

      <!-- Strobe dots -->
      <!-- Large dots -->
      <circle cx="0" cy="0" r="255" fill="none" stroke="var(--gray-0)" stroke-width="5" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="248" fill="none" stroke="var(--gray-0)" stroke-width="4" stroke-dasharray="8 5" />
      <circle cx="0" cy="0" r="242" fill="none" stroke="var(--gray-0)" stroke-width="4" stroke-dasharray="10 6" />
      <circle cx="0" cy="0" r="236" fill="none" stroke="var(--gray-0)" stroke-width="4" stroke-dasharray="12 7" />

      <!-- The Record -->
      <g id="lp" style="cursor: grab; touch-action: none;">
        <circle cx="0" cy="0" r="230" fill="url('#record')" filter="url(#spotlight)" />
        <!-- Record Label -->
        <clipPath id="label-clip">
          <circle cx="0" cy="0" r="75" />
        </clipPath>
        <image href="../assets/audio/J. Dilla - Ruff Draft - 2007/cover.svg" x="-75" y="-75" width="150" height="150"
          clip-path="url(#label-clip)" />
      </g>

      <!-- Spindle -->
      <circle cx="0" cy="0" r="8" fill="var(--gray-0)" />
      <circle cx="0" cy="0" r="3" fill="var(--white-0)" />
    </g>

    <!-- Pitch Slider -->
    <g transform="translate(670, 250)">
      <!-- Label -->
      <text x="32" y="262" font-size="8" fill="var(--gray-0)" text-anchor="middle" font-weight="bold">pitch adj.</text>

      <!-- Track Base -->
      <rect x="14" y="0" width="36" height="250" rx="4" fill="var(--black-0)" />
      <rect x="16" y="2" width="32" height="246" rx="3" fill="var(--gray-2)" />

      <!-- Slot with dust flaps -->
      <rect x="30" y="15" width="4" height="220" fill="var(--black-0)" />
      <rect x="30" y="15" width="1" height="220" fill="var(--gray-1)" opacity="0.3" />
      <rect x="33" y="15" width="1" height="220" fill="var(--gray-1)" opacity="0.3" />

      <!-- Scale Markings & Text -->
      <g id="pitch-scale" transform="translate(-16, 0)">
        <!-- Scale Text -->
        <text x="6" y="35" font-size="8" fill="var(--white-0)" text-anchor="end" dominant-baseline="middle">-8</text>
        <text x="6" y="80" font-size="8" fill="var(--white-0)" text-anchor="end" dominant-baseline="middle">-4</text>
        <rect id="pitch-zero-led" x="2" y="122" width="4" height="6" rx="1" fill="var(--black-0)" />
        <text x="6" y="170" font-size="8" fill="var(--white-0)" text-anchor="end" dominant-baseline="middle">+4</text>
        <text x="6" y="215" font-size="8" fill="var(--white-0)" text-anchor="end" dominant-baseline="middle">+8</text>

        <!-- Major Scale Markings -->
        <path d="M 12 35 L 26 35 M 12 80 L 26 80 M 12 125 L 26 125 M 12 170 L 26 170 M 12 215 L 26 215" stroke="var(--white-0)" stroke-width="1.5" />
        
        <!-- Minor Scale Markings (2, 6) -->
        <path d="M 16 57.5 L 26 57.5 M 16 102.5 L 26 102.5 M 16 147.5 L 26 147.5 M 16 192.5 L 26 192.5" stroke="var(--white-0)" stroke-width="1" />

        <!-- Ticks -->
        <path d="M 22 46.25 L 26 46.25 M 22 68.75 L 26 68.75 M 22 91.25 L 26 91.25 M 22 113.75 L 26 113.75 M 22 136.25 L 26 136.25 M 22 158.75 L 26 158.75 M 22 181.25 L 26 181.25 M 22 203.75 L 26 203.75" stroke="var(--white-0)" stroke-width="0.5" />
      </g>


      <!-- Slider Knob -->
      <g id="pitch-slider-knob" transform="translate(14, 125)" style="cursor: grab;">
        <rect x="0" y="-18" width="36" height="36" rx="2" fill="var(--black-0)" />
        <rect x="2" y="-16" width="32" height="32" rx="1" fill="var(--gray-0)" />
        <!-- Bevel highlights -->
        <rect x="2" y="-16" width="32" height="2" fill="var(--white-0)" opacity="0.5" />
        <rect x="2" y="14" width="32" height="2" fill="var(--black-0)" opacity="0.3" />
        <rect x="2" y="-16" width="2" height="32" fill="var(--white-0)" opacity="0.3" />
        <!-- Center groove line -->
        <rect x="2" y="-1" width="32" height="2" fill="var(--black-0)" />
      </g>
    </g>

    <!-- Tonearm -->
    <g transform="translate(680, 150)">
      <!-- Base Pivot -->
      <circle cx="0" cy="0" r="80" fill="var(--black-0)" />
      <circle cx="0" cy="0" r="70" fill="var(--gray-2)" />
      <circle cx="0" cy="0" r="50" fill="var(--black-0)" stroke="var(--gray-1)" stroke-width="2" />

      <!-- Counterweight -->
      <rect x="-20" y="-120" width="40" height="45" rx="4" fill="var(--gray-0)" />
      <rect x="-15" y="-130" width="30" height="10" rx="2" fill="var(--gray-1)" />

      <!-- Anti-skate dial -->
      <circle cx="60" cy="30" r="18" fill="var(--black-0)" />
      <circle cx="60" cy="30" r="14" fill="var(--gray-2)" />
      <circle cx="60" cy="30" r="10" fill="var(--black-0)" />

      <!-- The Arm Group (rotated to sit on the record) -->
      <g id="tonearm"
        style="transform-origin: 0px 0px; transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); transform: rotate(-25deg);">
        <!-- Pivot cap -->
        <circle cx="0" cy="0" r="15" fill="var(--gray-0)" />
        <circle cx="0" cy="0" r="8" fill="var(--black-0)" />

        <!-- Main S-tube -->
        <path d="M 0 0 C 0 120, -150 100, -200 220" fill="none" stroke="var(--gray-0)" stroke-width="10" />

        <!-- Headshell -->
        <g transform="translate(-200, 220) rotate(-25)">
          <!-- Connector -->
          <rect x="-8" y="-10" width="16" height="15" fill="var(--gray-1)" />
          <!-- Body -->
          <rect x="-12" y="5" width="24" height="50" rx="3" fill="var(--gray-2)" />
          <!-- Finger lift -->
          <path d="M 12 25 Q 30 25 30 40" fill="none" stroke="var(--gray-0)" stroke-width="3" />
        </g>
      </g>
    </g>

    <!-- Branding -->
    <g transform="translate(560, 600)">
      <text x="0" y="0" font-size="22" font-weight="900" fill="var(--gray-0)" letter-spacing="1">Technics</text>
      <text x="100" y="-2" font-size="12" fill="var(--gray-0)">QUARTZ</text>
      <text x="0" y="15" font-size="9" fill="var(--gray-1)">Direct Drive Turntable System SL-1210MK2</text>
    </g>

  </svg>

  <!-- Loading Overlay -->
  <div id="loading"
    style="position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--white-0); font-family: sans-serif; font-size: 24px; z-index: 10;">
    <div>Loading Audio Buffer...</div>
    <div style="font-size: 14px; color: var(--gray-0); margin-top: 10px;">Decoding high-quality vinyl scratch assets
    </div>
  </div>

  <script type="module">
    import { TurntableController } from './js/TurntableController.js';

    document.addEventListener('DOMContentLoaded', () => {
      const controller = new TurntableController();
      controller.initAudio('../assets/audio/J. Dilla - Ruff Draft - 2007/04 - Nothing Like This.mp3');
    });
  </script>
</body>

</html>
