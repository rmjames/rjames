<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreakBeat - Technics SL-1210MK2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: lch(10% 0 0);
      font-family: sans-serif;
    }

    svg {
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      border-radius: 15px;
    }

    :root {
      --white-0: lch(100% 0 0);
      --gray-0: lch(85.12% 0 0);
      --gray-1: lch(83.13% 0 0);
      --gray-2: lch(17.88% 0 0);
      --black-0: lch(14.85% 0 0);
    }
  </style>
</head>

<body>
  <svg viewBox="0 0 800 650" width="800" height="650" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Spotlight for the record -->
      <filter id='spotlight'>
        <feGaussianBlur stdDeviation='24' result='blur-1' />
        <feSpecularLighting result='spec-1' in='blur-1' specularExponent='16' lighting-color='lch(96% 0 0 / .2)'>
          <feSpotLight x='-900' y='-900' z='50' pointsAtX='0' pointsAtY='0' pointsAtZ='10' limitingConeAngle='5' />
        </feSpecularLighting>

        <!-- Mask highlight to the circle's shape to prevent overflow -->
        <feComposite in='spec-1' in2='SourceAlpha' operator='in' result='spec-masked' />
        <feComposite in='SourceGraphic' in2='spec-masked' operator='arithmetic' k1='0' k2='1' k3='1' k4='0' />
      </filter>

      <!-- Red glow for strobe -->
      <filter id='red-glow'>
        <feGaussianBlur stdDeviation='4' result='blur' />
        <feComposite in='SourceGraphic' in2='blur' operator='over' />
      </filter>

      <!-- Record Gradient -->
      <radialGradient color-interpolation="linearRGB" id="record">
        <stop offset="0%" stop-color="var(--gray-0)" />
        <stop offset="2%" stop-color="var(--gray-0)" />

        <stop offset="2%" stop-color="var(--white-0)" />
        <stop offset="10%" stop-color="var(--white-0)" />

        <stop offset="10%" stop-color="var(--gray-1)" />
        <stop offset="10.5%" stop-color="var(--gray-1)" />

        <stop offset="10.5%" stop-color="var(--white-0)" />
        <stop offset="30%" stop-color="var(--white-0)" />

        <stop offset="30%" stop-color="var(--black-0)" />
        <stop offset="42%" stop-color="var(--black-0)" />
        <stop offset="42%" stop-color="var(--gray-2)" />

        <stop offset="52%" stop-color="var(--gray-2)" />
        <stop offset="52%" stop-color="var(--black-0)" />
        <stop offset="52.5%" stop-color="var(--black-0)" />
        <stop offset="52.5%" stop-color="var(--gray-2)" />

        <stop offset="64%" stop-color="var(--gray-2)" />
        <stop offset="64%" stop-color="var(--black-0)" />
        <stop offset="64.5%" stop-color="var(--black-0)" />
        <stop offset="64.5%" stop-color="var(--gray-2)" />

        <stop offset="76%" stop-color="var(--gray-2)" />
        <stop offset="76%" stop-color="var(--black-0)" />
        <stop offset="76.5%" stop-color="var(--black-0)" />
        <stop offset="76.5%" stop-color="var(--gray-2)" />

        <stop offset="88%" stop-color="var(--gray-2)" />
        <stop offset="88.5%" stop-color="var(--black-0)" />
        <stop offset="88.5%" stop-color="var(--black-0)" />
        <stop offset="88.5%" stop-color="var(--gray-2)" />

        <stop offset="98%" stop-color="var(--gray-2)" />
        <stop offset="98%" stop-color="var(--black-0)" />
        <stop offset="100%" stop-color="var(--black-0)" />
      </radialGradient>
    </defs>

    <!-- Turntable Base -->
    <rect x="0" y="0" width="800" height="650" rx="15" fill="var(--black-0)" stroke="lch(25% 0 0)" stroke-width="2" />
    <rect x="20" y="20" width="760" height="610" rx="10" fill="lch(12% 0 0)" />

    <!-- 45 Adapter -->
    <g transform="translate(80, 80)">
      <circle cx="0" cy="0" r="32" fill="var(--black-0)" />
      <circle cx="0" cy="0" r="28" fill="var(--gray-2)" />
      <circle cx="0" cy="0" r="22" fill="var(--gray-0)" />
      <circle cx="0" cy="0" r="8" fill="var(--black-0)" />
    </g>

    <!-- Power Switch & Strobe -->
    <g transform="translate(60, 480)">
      <!-- Base -->
      <circle cx="0" cy="0" r="30" fill="var(--black-0)" />
      <!-- Power Dial -->
      <circle cx="0" cy="0" r="22" fill="var(--gray-2)" />
      <circle cx="0" cy="0" r="18" fill="var(--gray-0)" />
      <circle cx="0" cy="0" r="14" fill="var(--black-0)" />
      <!-- Dial grip dots -->
      <circle cx="0" cy="-10" r="1.5" fill="var(--white-0)" />

      <!-- Strobe tower -->
      <g transform="translate(30, -30) rotate(30)">
        <rect x="-10" y="-15" width="20" height="30" rx="3" fill="var(--gray-0)" />
        <!-- Red Light Glow -->
        <ellipse cx="0" cy="15" rx="8" ry="12" fill="lch(50% 100 40)" filter="url(#red-glow)" />
      </g>
    </g>

    <!-- Start/Stop Button -->
    <g transform="translate(40, 540)" id="start-stop-btn" style="cursor: pointer;">
      <rect x="0" y="0" width="80" height="60" rx="2" fill="var(--black-0)" />
      <rect x="5" y="5" width="70" height="50" rx="4" fill="var(--gray-0)" stroke="var(--gray-1)" stroke-width="2" />
      <text x="40" y="30" font-size="11" fill="var(--black-0)" text-anchor="middle" font-weight="bold">start ·
        stop</text>
    </g>

    <!-- 33 / 45 Buttons -->
    <g transform="translate(140, 565)">
      <!-- 33 Base -->
      <g id="btn-33" style="cursor: pointer;">
        <rect x="0" y="-5" width="40" height="30" rx="2" fill="var(--black-0)" />
        <rect id="btn-33-cap" x="2.5" y="0" width="35" height="20" rx="2" fill="var(--gray-0)" />
        <text x="20" y="14" font-size="11" fill="var(--black-0)" text-anchor="middle" font-weight="bold">33</text>
      </g>

      <!-- 45 Base -->
      <g id="btn-45" style="cursor: pointer;">
        <rect x="50" y="-5" width="40" height="30" rx="2" fill="var(--black-0)" />
        <rect id="btn-45-cap" x="52.5" y="0" width="35" height="20" rx="2" fill="var(--gray-0)" />
        <text x="70" y="14" font-size="11" fill="var(--black-0)" text-anchor="middle" font-weight="bold">45</text>
      </g>
    </g>

    <!-- Platter Base & Strobe Dots -->
    <g transform="translate(330, 310)">
      <!-- Platter shadow -->
      <circle cx="5" cy="10" r="265" fill="lch(5% 0 0 / .5)" />

      <!-- Platter rim -->
      <circle cx="0" cy="0" r="265" fill="var(--gray-2)" />
      <circle cx="0" cy="0" r="260" fill="var(--black-0)" />

      <!-- Strobe dots -->
      <!-- Large dots -->
      <circle cx="0" cy="0" r="255" fill="none" stroke="var(--gray-0)" stroke-width="5" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="248" fill="none" stroke="var(--gray-0)" stroke-width="4" stroke-dasharray="8 5" />
      <circle cx="0" cy="0" r="242" fill="none" stroke="var(--gray-0)" stroke-width="4" stroke-dasharray="10 6" />
      <circle cx="0" cy="0" r="236" fill="none" stroke="var(--gray-0)" stroke-width="4" stroke-dasharray="12 7" />

      <!-- The Record -->
      <g id="lp" style="cursor: grab; touch-action: none;">
        <circle cx="0" cy="0" r="230" fill="url('#record')" filter="url(#spotlight)" />
        <!-- Record Label -->
        <clipPath id="label-clip">
          <circle cx="0" cy="0" r="75" />
        </clipPath>
        <image href="../assets/audio/J. Dilla - Ruff Draft - 2007/cover.svg" x="-75" y="-75" width="150" height="150"
          clip-path="url(#label-clip)" />
      </g>

      <!-- Spindle -->
      <circle cx="0" cy="0" r="8" fill="var(--gray-0)" />
      <circle cx="0" cy="0" r="3" fill="var(--white-0)" />
    </g>

    <!-- Pitch Slider -->
    <g transform="translate(680, 250)">
      <rect x="0" y="0" width="40" height="250" rx="4" fill="var(--black-0)" />
      <rect x="2" y="2" width="36" height="246" rx="3" fill="var(--gray-2)" />

      <!-- Slot -->
      <rect x="18" y="15" width="4" height="220" fill="var(--black-0)" />

      <!-- Scale markings -->
      <path d="M 5 125 L 15 125 M 10 70 L 15 70 M 10 180 L 15 180" stroke="var(--white-0)" stroke-width="1.5" />
      <path d="M 12 95 L 15 95 M 12 155 L 15 155" stroke="var(--white-0)" stroke-width="1" />

      <!-- Zero pitch LED -->
      <circle cx="2" cy="125" r="3" fill="lch(80% 100 135)" />

      <!-- Slider Knob -->
      <g id="pitch-slider-knob" transform="translate(0, 125)" style="cursor: grab;">
        <rect x="5" y="-20" width="30" height="40" rx="3" fill="var(--gray-0)" />
        <rect x="5" y="-2" width="30" height="4" fill="var(--black-0)" />
      </g>
    </g>

    <!-- Tonearm -->
    <g transform="translate(680, 150)">
      <!-- Base Pivot -->
      <circle cx="0" cy="0" r="80" fill="var(--black-0)" />
      <circle cx="0" cy="0" r="70" fill="var(--gray-2)" />
      <circle cx="0" cy="0" r="50" fill="var(--black-0)" stroke="var(--gray-1)" stroke-width="2" />

      <!-- Counterweight -->
      <rect x="-20" y="-120" width="40" height="45" rx="4" fill="var(--gray-0)" />
      <rect x="-15" y="-130" width="30" height="10" rx="2" fill="var(--gray-1)" />

      <!-- Anti-skate dial -->
      <circle cx="60" cy="30" r="18" fill="var(--black-0)" />
      <circle cx="60" cy="30" r="14" fill="var(--gray-2)" />
      <circle cx="60" cy="30" r="10" fill="var(--black-0)" />

      <!-- The Arm Group (rotated to sit on the record) -->
      <g id="tonearm"
        style="transform-origin: 0px 0px; transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); transform: rotate(-25deg);">
        <!-- Pivot cap -->
        <circle cx="0" cy="0" r="15" fill="var(--gray-0)" />
        <circle cx="0" cy="0" r="8" fill="var(--black-0)" />

        <!-- Main S-tube -->
        <path d="M 0 0 C 0 120, -150 100, -200 220" fill="none" stroke="var(--gray-0)" stroke-width="10" />

        <!-- Headshell -->
        <g transform="translate(-200, 220) rotate(-25)">
          <!-- Connector -->
          <rect x="-8" y="-10" width="16" height="15" fill="var(--gray-1)" />
          <!-- Body -->
          <rect x="-12" y="5" width="24" height="50" rx="3" fill="var(--gray-2)" />
          <!-- Finger lift -->
          <path d="M 12 25 Q 30 25 30 40" fill="none" stroke="var(--gray-0)" stroke-width="3" />
        </g>
      </g>
    </g>

    <!-- Branding -->
    <g transform="translate(560, 600)">
      <text x="0" y="0" font-size="22" font-weight="900" fill="var(--gray-0)" letter-spacing="1">Technics</text>
      <text x="100" y="-2" font-size="12" fill="var(--gray-0)">QUARTZ</text>
      <text x="0" y="15" font-size="9" fill="var(--gray-1)">Direct Drive Turntable System SL-1210MK2</text>
    </g>

  </svg>

  <!-- Loading Overlay -->
  <div id="loading" style="position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--white-0); font-family: sans-serif; font-size: 24px; z-index: 10;">
    <div>Loading Audio Buffer...</div>
    <div style="font-size: 14px; color: var(--gray-0); margin-top: 10px;">Decoding high-quality vinyl scratch assets</div>
  </div>

  <script type="module">
    import { TurntableController } from './js/TurntableController.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      const controller = new TurntableController();
      controller.initAudio('../assets/audio/J. Dilla - Ruff Draft - 2007/04 - Nothing Like This.mp3');
    });
  </script>
</body>

</html>
