<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com data:; img-src 'self' https://assets.codepen.io data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; frame-src 'self'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headphones Knock</title>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <script src="../scripts/favicon-animator.js" async></script>
    <style>
        body {
            display: grid;
            place-items: center;
            block-size: 100vh;
            background-color: oklch(from hsl(210 32% 12%) l c h);
            margin: 0;
            overflow: hidden;
            container-type: inline-size;
            font-family: system-ui, -apple-system, BlinkMacSystemFont;

            --base: oklch(from hsl(210 4% 4%) l c h);
            --accent: oklch(from hsl(210 96% 96%) l c h);
            /* Frequency response variables */
            --low: 0;
            --mid: 0;
            --high: 0;
        }

        body>* {
            grid-area: 1/1;
        }

        .headphone {
            font-size: 20cqi;
            background: linear-gradient(in oklab, var(--base) 2%, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: default;
            scale: calc(1 + var(--low) * .5);
            filter: drop-shadow(0 0 calc(var(--mid) * 10px) oklch(from var(--accent) l c h / .1));
            contain: layout paint;
            transition: scale .3s cubic-bezier(0.19, 1, 0.22, 1);
        }

        select,
        ::picker(select) {
            appearance: base-select;
        }

        select::picker-icon {
            display: none;
        }

        selectedcontent {
            display: block;
            white-space: nowrap;
            max-inline-size: max-content;
        }

        option {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .5rem 1rem;
            font-size: .875rem;
            transition: font-size .2s cubic-bezier(.25, .46, .45, .94), opacity .2s cubic-bezier(.25, .46, .45, .94), font-weight .2s cubic-bezier(.25, .46, .45, .94);
            transform-origin: left 48%;
            opacity: .7;

            &::checkmark {
                content: '💿'
            }
        }

        option:hover,
        option:focus {
            font-size: .95rem;
            opacity: 1;
            font-weight: 500;
        }

        option:has(+ option:hover),
        option:hover+option {
            font-size: .9rem;
            opacity: .9;
            font-weight: 400;
        }

        option:has(+ option + option:hover),
        option:hover+option+option {
            font-size: .875rem;
            opacity: .8;
            font-weight: 400;
        }

        option:has(+ option + option + option:hover),
        option:hover+option+option+option {
            font-size: .875rem;
            opacity: .75;
            font-weight: 400;
        }

        :is(optgroup, .headphone, .note, .notes) {
            contain: layout;
        }

        ::picker(select) {
            opacity: 0;
            clip-path: circle(0% at top right);
            position: fixed;
            position-anchor: none;
            position-area: none;
            inset-area: none;
            inset: 0;
            margin: 0;
            border: 0;
            padding: 0;
            border-radius: 0;
            transition: clip-path .72s cubic-bezier(.34, 1.56, .64, 1),
                display .5s allow-discrete,
                overlay .5s allow-discrete;
        }

        :open::picker(select) {
            opacity: 1;
            clip-path: circle(150% at top right);
            inline-size: 100vw;
            block-size: 100vh;
            background-color: color-mix(in oklch, var(--base), transparent 56%);
        }

        @starting-style {
            :open::picker(select) {
                opacity: 0;
                clip-path: circle(0% at top right);
            }
        }

        :where(.note, .notes) {
            font-size: 12cqi;
            background: linear-gradient(in oklch, var(--base) 2%, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            pointer-events: none;
            opacity: calc(.2 + var(--high) * .8);

            @starting-style {
                opacity: 0;
            }
        }

        .note {
            animation: note 2.48s infinite;
        }

        .notes {
            animation: notes 2.48s -.125s infinite;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--accent);
            opacity: 0.5;
            transition: opacity 0.2s;
            padding: 0;
            display: grid;
            place-items: center;

            &:hover {
                opacity: 1;
            }

            & path {
                transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.1s cubic-bezier(0.4, 0, 0.2, 1);
                transform-box: fill-box;
                transform-origin: center;
            }

            & .pause-path {
                opacity: 0;
                transform: scale(0.5) rotate(90deg);
            }

            &.pulse {
                animation: pulse-btn 1.5s infinite alternate;
                opacity: 1;
            }
        }

        .toggle-btn.playing {
            color: var(--accent);
            opacity: 1;

            & .play-path {
                opacity: 0;
                transform: scale(0.5) rotate(-90deg);
            }

            & .pause-path {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .filter-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10;
            display: flex;
            gap: .35rem;
            align-items: center;
            padding: 0.5rem .5rem;
            border: 1px solid oklch(from var(--accent) l c h / 0.3);
            border-radius: 1rem;
            backdrop-filter: blur(.5rem);
            background-color: oklch(.34 0 0 / .64);
            inline-size: min(8rem, calc(100cqi - 2rem));
            container-type: inline-size;
            transition: opacity .4s cubic-bezier(.34, 1.56, .64, 1), border-color .3s;

            @supports (corner-shape: squircle) {
                corner-shape: squircle;
                border-radius: 1.5rem;
            }

            &.playing {
                color: var(--accent);
                border-color: var(--accent);
            }

            &:has(select:open),
            &:has(select:popover-open) {
                opacity: .125;
            }
        }

        .filter-select {
            inline-size: 10rem;
            max-block-size: 2.4rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid oklch(from var(--accent) l c h / 0.3);
            border-radius: .5rem;
            background: oklch(from var(--base) l c h / 0.45);
            backdrop-filter: blur(.5rem);
            color: var(--accent);
            font-size: 0.875rem;
            outline: none;
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.2s, background 0.2s;

            & button {
                container-type: inline-size;
                inline-size: 100%;
                overflow: hidden;
                display: flex;
                align-items: center;
            }

            & option {
                color: var(--accent);
            }

            & optgroup {
                color: oklch(from var(--accent) l c h / .7);
                font-style: normal;
                font-weight: 600;
            }

            @supports (corner-shape: squircle) {
                corner-shape: squircle;
                border-radius: .75rem;
            }
        }

        .filter-select:focus,
        .filter-container:focus-within,
        .filter-container:active {
            border-color: var(--accent);
        }

        .filter-container:hover selectedcontent,
        .filter-select:focus-within selectedcontent {
            animation: text-scroll-reveal 16s linear infinite alternate;
            animation-delay: 0.5s;
        }

        .artist-label {
            display: none;
            color: var(--accent);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
            align-self: flex-start;
        }

        .headphone,
        .note,
        .notes {
            animation-play-state: paused;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translateX(-.125px);
            }

            20%,
            80% {
                transform: translateX(1.25px);
            }

            30%,
            50%,
            70% {
                transform: translateX(-.75px);
            }

            40%,
            60% {
                transform: translateX(.75px);
            }

            0%,
            100% {
                transform: translateX(0);
            }
        }

        @keyframes note {
            0% {
                opacity: 0;
                transform: translate(4.5cqi, .25em);
            }

            32% {
                opacity: .48;
            }

            100% {
                opacity: 0;
                transform: translate(8.5cqi, -12.5cqi);
                font-size: 3cqi;
            }
        }

        @keyframes notes {
            0% {
                opacity: 0;
                transform: translate(-4.5cqi, .25em);
            }

            32% {
                opacity: .16;
            }

            100% {
                opacity: 0;
                transform: translate(-8.5cqi, -12.52cqi);
                font-size: 3cqi;
            }
        }

        @keyframes pulse-btn {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.2);
            }
        }

        @keyframes text-scroll-reveal {

            0%,
            20% {
                transform: translateX(0);
            }

            80%,
            100% {
                transform: translateX(min(0px, calc(100cqi - 100%)));
            }
        }
    </style>
</head>

<body>
    <div class='headphone'>🎧</div>
    <div class='note'>🎶</div>
    <div class='notes'>🎶</div>

    <div class="filter-container">
        <label for="track-select" class="artist-label">Select Audio</label>
        <select id="track-select" class="filter-select">
            <button>
                <selectedcontent></selectedcontent>
            </button>
            <option value="">J. Dilla</option>
        </select>
        <button class="toggle-btn pulse" data-analytics-element="Toggle Animation" aria-label="Play animation">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="currentColor">
                <path class="play-path" d="M320-200v-560l440 280-440 280Zm80-280Zm0 134 210-134-210-134v268Z" />
                <path class="pause-path"
                    d="M528-192v-576h240v576H528Zm-336 0v-576h240v576H192Zm408-72h96v-432h-96v432Zm-336 0h96v-432h-96v432Zm0-432v432-432Zm336 0v432-432Z" />
            </svg>
        </button>
    </div>
    <script type="module">
        import { audioLibrary } from '../scripts/AudioLibrary.js';

        const PREVIEW_DURATION_SEC = 52;
        const FADE_DURATION_SEC = 2;

        const els = {
            btn: document.querySelector('.toggle-btn'),
            trackSelect: document.getElementById('track-select'),
            filterContainer: document.querySelector('.filter-container'),
            animated: document.querySelectorAll('.headphone, .note, .notes'),
            root: document.body
        };

        const Utils = {
            cleanTitle: (title) => title ? title.replace(/^\d+[\s.-]*/, '').trim() : '',

            normalizeFrequency: (data, binStart, binCount, exponent = 1.0) => {
                let sum = 0;
                for (let i = binStart; i < binStart + binCount; i++) sum += data[i];
                return Math.pow((sum / binCount) / 255, exponent);
            },

            getRandomTrack: (tracks, filterTerm = '') => {
                const term = filterTerm.toLowerCase();
                let filtered = tracks;

                if (term) {
                    filtered = tracks.filter(t =>
                        (t.title && Utils.cleanTitle(t.title).toLowerCase().startsWith(term)) ||
                        (t.artist && t.artist.toLowerCase().startsWith(term)) ||
                        (t.album && t.album.toLowerCase().startsWith(term))
                    );
                } else {
                    const dillaTracks = tracks.filter(t => t.artist?.toLowerCase().includes('dilla'));
                    if (dillaTracks.length > 0) filtered = dillaTracks;
                }

                if (filtered.length === 0) filtered = tracks;
                return filtered[Math.floor(Math.random() * filtered.length)];
            }
        };

        let state = {
            isPlaying: false,
            isFirstInteraction: true,
            audioCtx: null,
            analyser: null,
            dataArray: null,
            audio: new Audio(),
            source: null
        };

        function setState(updates) {
            state = { ...state, ...updates };
            renderUI(state);
        }

        function renderUI(s) {
            els.btn.classList.toggle('playing', s.isPlaying);
            els.btn.classList.toggle('pulse', s.isFirstInteraction);
            els.filterContainer.classList.toggle('playing', s.isPlaying);
            els.btn.setAttribute('aria-label', s.isPlaying ? 'Pause animation' : 'Play animation');
            els.animated.forEach(el => el.style.animationPlayState = s.isPlaying ? 'running' : 'paused');

            if (!s.isPlaying) {
                s.audio.pause();
                els.root.style.setProperty('--low', 0);
                els.root.style.setProperty('--mid', 0);
                els.root.style.setProperty('--high', 0);
            }
        }

        const AudioEngine = {
            init: () => {
                if (state.audioCtx) return;

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.36;

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                const source = audioCtx.createMediaElementSource(state.audio);

                source.connect(analyser);
                analyser.connect(audioCtx.destination);

                setState({ audioCtx, analyser, dataArray, source });
                requestAnimationFrame(updateVisuals);
            },

            handleTimeUpdate: (e) => {
                const { currentTime, volume } = e.target;
                if (currentTime >= PREVIEW_DURATION_SEC) {
                    AudioEngine.stop(true);
                    return;
                }

                const fadeStart = PREVIEW_DURATION_SEC - FADE_DURATION_SEC;
                if (currentTime > fadeStart) {
                    const newVolume = Math.max(0, Math.min(1, (PREVIEW_DURATION_SEC - currentTime) / FADE_DURATION_SEC));
                    state.audio.volume = newVolume;
                } else if (state.audio.volume !== 1) {
                    state.audio.volume = 1;
                }
            },

            stop: (fullReset = false) => {
                state.audio.pause();
                state.audio.currentTime = 0;
                if (fullReset) els.trackSelect.value = '';
                setState({ isPlaying: false, isFirstInteraction: fullReset });
            },

            play: async (track) => {
                AudioEngine.init();

                if (state.audioCtx.state === 'suspended') {
                    await state.audioCtx.resume();
                }

                const targetSrc = new URL(track.src, window.location.href).href;
                if (state.audio.src !== targetSrc) {
                    state.audio.src = track.src;
                    state.audio.load();
                } else {
                    state.audio.currentTime = 0;
                }

                state.audio.volume = 1;
                state.audio.muted = false;
                try {
                    await state.audio.play();
                    setState({ isPlaying: true });
                } catch (err) {
                    AudioEngine.stop();
                }
            }
        };

        function updateVisuals() {
            if (!state.isPlaying) {
                els.root.style.setProperty('--low', 0);
                els.root.style.setProperty('--mid', 0);
                els.root.style.setProperty('--high', 0);
            } else {
                state.analyser.getByteFrequencyData(state.dataArray);

                const low = Utils.normalizeFrequency(state.dataArray, 0, 2, 1.8);
                const mid = Utils.normalizeFrequency(state.dataArray, 4, 11, 2.0);
                const high = Utils.normalizeFrequency(state.dataArray, 40, 88, 1.2);

                els.root.style.setProperty('--low', low.toFixed(3));
                els.root.style.setProperty('--mid', mid.toFixed(3));
                els.root.style.setProperty('--high', high.toFixed(3));
            }
            requestAnimationFrame(updateVisuals);
        }

        // --- Initialization ---
        state.audio.ontimeupdate = AudioEngine.handleTimeUpdate;
        state.audio.onended = () => AudioEngine.stop(true);
        state.audio.volume = 1;

        const populateDropdown = () => {
            const grouped = audioLibrary.tracks.reduce((acc, track) => {
                const artist = track.artist && track.artist.toLowerCase() !== 'unknown artist' ? track.artist : 'Other';
                const title = Utils.cleanTitle(track.title) || 'Unknown Title';
                acc[artist] = acc[artist] || [];
                if (!acc[artist].includes(title)) acc[artist].push(title);
                return acc;
            }, {});

            Object.keys(grouped).sort().forEach(artist => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = artist;
                grouped[artist].sort().forEach(title => {
                    const option = document.createElement('option');
                    option.value = title;
                    option.textContent = title;
                    optgroup.appendChild(option);
                });
                els.trackSelect.appendChild(optgroup);
            });
        };

        populateDropdown();

        els.trackSelect.addEventListener('change', () => {
            const selection = els.trackSelect.value;
            AudioEngine.stop(true);
            els.trackSelect.value = selection;
            AudioEngine.play(Utils.getRandomTrack(audioLibrary.tracks, selection));
        });

        els.btn.addEventListener('click', () => {
            if (state.isFirstInteraction) setState({ isFirstInteraction: false });
            state.isPlaying ? AudioEngine.stop() : AudioEngine.play(Utils.getRandomTrack(audioLibrary.tracks, els.trackSelect.value));
        });
    </script>
</body>

</html>
