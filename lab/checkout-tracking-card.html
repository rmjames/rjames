<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com data:; img-src 'self' https://assets.codepen.io data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://robertjames.nyc https://www.google-analytics.com https://analytics.google.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; frame-src 'self'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Tracking Card</title>
    <link rel="stylesheet" href="../styles/lab/checkout-tracking-card.css">
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../styles/lab-shared.css">
    <link rel="modulepreload" href="../scripts/favicon-animator.js">
    <script type="module" src="../scripts/favicon-animator.js" async></script>
</head>

<body>
    <a href="../lab.html" class="back-link" aria-label="Back to Labs">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
        <span>Back</span>
    </a>
    <article class="tracking-card">
        <header class="card-header">

        </header>
        <div class="tracking-visual">
            <form class="form-checkout">
                <label class='check'>
                    <input id='order' name='order' type="checkbox" disabled>
                    <span class="step-label">Ordered</span>
                    <span class="step-date">Oct 08</span>
                </label>
                <div class="line l-prep-js"></div>
                <label class='check'>
                    <input id='prepare' name='prepare' type="checkbox">
                    <span class="step-label">Preparing<br>to ship</span>
                    <div class="icon-wrapper--truck">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"
                            aria-hidden="true">
                            <path
                                d="M160-120q-33 0-56.5-23.5T80-200v-440q0-33 23.5-56.5T160-720h520v120h160l80 120v280q0 33-23.5 56.5T840-120h-45q-13-37-44.5-58.5T680-200q-38 0-69.5 21.5T566-120H394q-13-37-44.5-58.5T280-200q-38 0-69.5 21.5T165-120h-5Zm120-80q17 0 28.5-11.5T320-240q0-17-11.5-28.5T280-280q-17 0-28.5 11.5T240-240q0 17 11.5 28.5T280-200Zm400 0q17 0 28.5-11.5T720-240q0-17-11.5-28.5T680-280q-17 0-28.5 11.5T640-240q0 17 11.5 28.5T680-200ZM160-640v360h33q13-37 44.5-58.5T308-360h344q13 37 44.5 58.5T741-280h19v-160h-85l-75-110v-90H160Zm0 0v440-440Z">
                            </path>
                        </svg>
                    </div>
                </label>
                <div class="line l-ship-js"></div>
                <label class='check'>
                    <input id='ship' name='ship' type="checkbox">
                    <span class="step-label">Shipping</span>
                </label>
                <div class="line l-arrv-js"></div>
                <label class='check'>
                    <input id='arrive' name='arrive' type="checkbox">
                    <span class="step-label">Delivers</span>
                    <span class="step-date">Oct 13<br>- Oct 14</span>
                </label>
            </form>
        </div>
    </article>
    <button class="reset-btn" data-analytics-element="Reset Animation" aria-label="Replay animation">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor" aria-hidden="true">
            <path
                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
    </button>
    <script type="module">
        const steps = ['order', 'prepare', 'ship', 'arrive'];

        function updateCascade(index) {
            const el = document.getElementById(steps[index]);
            if (!el) return;

            if (el.checked) {
                for (let i = 0; i < index; i++) {
                    const prevEl = document.getElementById(steps[i]);
                    if (prevEl && !prevEl.checked) {
                        prevEl.checked = true;
                    }
                }
            } else {
                for (let i = index + 1; i < steps.length; i++) {
                    const nextEl = document.getElementById(steps[i]);
                    if (nextEl && nextEl.checked) {
                        nextEl.checked = false;
                    }
                }
            }
        }

        steps.forEach((id, index) => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('command', e => {
                    if (e.command === `--set-${id}`) {
                        el.checked = true;
                        el.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });

                el.addEventListener('change', () => {
                    updateCascade(index);
                });
            }
        });

        document.querySelectorAll('button[commandfor]').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.getAttribute('commandfor');
                const el = document.getElementById(id);
                if (el) {
                    el.checked = true;
                    el.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
        });

        let timeoutIds = [];

        function activateStep(id) {
            const el = document.getElementById(id);
            if (el && !el.checked) {
                el.checked = true;
                el.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        function startAnimation() {
            const delays = [800, 2200, 3800, 5400];
            timeoutIds = steps.map((id, i) => {
                return setTimeout(() => activateStep(id), delays[i]);
            });
        }

        function resetAnimation() {
            timeoutIds.forEach(id => clearTimeout(id));
            steps.forEach(id => {
                const el = document.getElementById(id);
                if (el && id !== 'order') {
                    el.checked = false;
                    el.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
            startAnimation();
        }

        const resetBtn = document.querySelector('.reset-btn');
        if (resetBtn) {
            resetBtn.addEventListener('click', resetAnimation);
        }

        window.addEventListener('load', startAnimation);
    </script>
</body>

</html>
