<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' data:; img-src 'self' https://assets.codepen.io __MEDIA_CDN__ data:; media-src 'self' __MEDIA_CDN__ blob: data:; font-src 'self'; connect-src 'self' https://robertjames.nyc __MEDIA_CDN__ https://www.google-analytics.com https://analytics.google.com https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; frame-src 'self'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player Widget</title>
    <link rel="stylesheet" href="../styles/components/media-player.css">
    <style>
        .media-player {
            grid-template-columns: auto 1fr;
            grid-template-rows: .5rem 1.75rem;
            gap: .5rem;
            padding: .75rem;
            padding-inline-start: 0;
            inline-size: 18.5rem;
            border-radius: .75rem;
            align-items: center;
            overflow: clip;
        }

        .media-player__controls {
            grid-column: 2;
            grid-template-columns: repeat(5, 1fr);
            gap: .125rem;
            inline-size: 15rem;
            background: transparent;

            button {
                outline: none;
                background: transparent;
                padding: 0;

                &:hover {
                    background: transparent;
                }
            }
        }

        .media-player__current {
            grid-column: 1;
            grid-row: span 2;
            inline-size: 3rem;
            block-size: 4.5rem;
            padding: 0;
            border-radius: initial !important;
        }

        .media-player__meta {
            grid-column: 2 / -1;
            grid-row: 1;
            flex-direction: row;
            justify-content: start;
            gap: .5rem;
            padding-inline-start: .75rem;
            width: 100%;
            overflow: clip;
        }

        .media-player__meta__title {
            font-size: .65rem;
        }

        .media-player__meta__artist {
            font-size: .55rem;
        }

        .media-player__play {
            background-color: transparent !important;
        }
    </style>
    <link rel="apple-touch-icon" href="../images/icon-ios.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="../images/icon.svg" id="favicon-svg" />
    <link rel="icon" type="image/png" href="../favicon_144.png" sizes="144x144" />
    <link rel="icon" type="image/png" href="../favicon_512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="../favicon_192.png" sizes="192x192" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="modulepreload" href="../scripts/favicon-animator.js">
    <script type="module" src="../scripts/favicon-animator.js" async></script>
</head>

<body>
    <main id="player-mount"></main>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script type="module">
        import { MediaPlayerCore } from '../scripts/media/MediaPlayerCore.js';
        import { buildWidgetPlayer } from '../scripts/media/WidgetPlayer.js';

        const mount = document.getElementById('player-mount');
        const audio = document.getElementById('audio-player');
        const core = new MediaPlayerCore(audio);

        buildWidgetPlayer(mount, core, document);

        if (core.tracks && core.tracks.length > 0) {
            core.loadTrack(0);
        }
    </script>
</body>

</html>
