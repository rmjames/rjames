<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Bezier Path Visualizer</title>
    <style>
        :root {
            --surface-1: oklch(0.18 0 0);
            --surface-2: oklch(0.24 0 0);
            --text-1: oklch(0.95 0 0);
            --text-2: oklch(0.75 0 0);
            --accent: oklch(0.75 0.15 45);
            /* amber/orange */
            --accent-alpha: oklch(0.75 0.15 45 / 0.1);
            --grid-major: oklch(1 0 0 / 0.15);
            --grid-minor: oklch(1 0 0 / 0.05);
            --anchor: oklch(0.6 0.15 250);
            /* blue */
            --anchor-alpha: oklch(0.6 0.15 250 / 0.3);
            --control: oklch(0.6 0.15 0);
            /* pink/red */
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--surface-1);
            color: var(--text-1);
            min-block-size: 100vh;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 200px minmax(300px, 1fr) 1.5fr;
            gap: 1.5rem;
        }

        /* History Panel */
        .history-container {
            background: var(--surface-2);
            border-radius: 0.5rem;
            border: 1px solid var(--grid-major);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-block-size: calc(100vh - 4rem);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-item {
            padding: 0.5rem;
            background: var(--surface-1);
            border: 1px solid var(--grid-minor);
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            transition: border-color 0.1s;
        }

        .history-item:hover {
            border-color: var(--anchor-alpha);
        }

        .history-item.active {
            border-color: var(--anchor);
            background: color-mix(in oklch, var(--anchor) 15%, var(--surface-1));
        }

        .history-item-top {
            display: flex;
            justify-content: space-between;
        }

        .history-item-time {
            color: var(--text-2);
            font-size: 0.7rem;
        }

        /* Editor */
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-block-size: calc(100vh - 4rem);
        }

        .editor-panes {
            display: flex;
            gap: 1rem;
            flex-grow: 1;
            overflow: hidden;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .btn {
            background: var(--surface-2);
            color: var(--text-1);
            border: 1px solid var(--grid-major);
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        textarea {
            flex: 1;
            background: var(--surface-2);
            color: var(--text-1);
            border: 1px solid var(--grid-major);
            padding: 1rem;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            border-radius: 0.5rem;
            resize: none;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.2s;
            white-space: pre;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .diff-textarea {
            display: none;
            /* hidden until checkpoint selected */
            background: color-mix(in oklch, var(--anchor) 10%, var(--surface-2));
            color: oklch(0.8 0.05 250);
            border-color: var(--anchor-alpha);
        }

        /* Preview */
        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            max-block-size: calc(100vh - 4rem);
        }

        .svg-wrapper {
            inline-size: 100%;
            max-block-size: calc(100vh - 12rem);
            aspect-ratio: 1;
            background: var(--surface-2);
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid var(--grid-major);
        }

        svg {
            inline-size: 100%;
            block-size: 100%;
            display: block;
            touch-action: none;
        }

        .tools {
            display: flex;
            gap: 2rem;
            align-items: center;
            background: var(--surface-2);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--grid-major);
            inline-size: 100%;
            box-sizing: border-box;
            overflow-x: auto;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.75rem;
            min-width: fit-content;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-color {
            inline-size: 0.75rem;
            block-size: 0.75rem;
            border-radius: 50%;
        }

        .draggable {
            cursor: grab;
            transition: stroke-width 0.1s;
        }

        .draggable:hover {
            stroke: #fff;
            stroke-width: 0.1;
        }

        .bg-anchor {
            background: var(--anchor);
        }

        .bg-control {
            background: var(--control);
        }

        .bg-path {
            background: var(--accent);
        }

        .bg-diff {
            border: 1px dashed var(--anchor);
            background: transparent;
        }

        .error-msg {
            color: oklch(0.6 0.15 0);
            font-size: 0.8rem;
            block-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="history-container">
        <div class="editor-header">
            <h2>Checkpoints</h2>
            <button id="addCheckpointBtn" class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem">Save</button>
        </div>
        <p style="margin: 0; font-size: 0.75rem; color: var(--text-2);">Click a state to diff</p>
        <div class="history-list" id="historyListItems"></div>
    </div>

    <div class="editor-container">
        <div class="editor-header">
            <h2>Path Reference Data</h2>
            <button id="copyBtn" class="btn">Copy Current Format</button>
        </div>
        <div id="errorDisplay" class="error-msg"></div>
        <div class="editor-panes">
            <textarea id="diffEditor" class="diff-textarea" readonly></textarea>
            <textarea id="codeEditor" wrap="off">[
  [0.5, 0.15],
  [0.72, 0.15, 0.82, 0.25, 0.82, 0.42],
  [0.82, 0.45, 0.85, 0.48, 0.85, 0.52],
  [0.95, 0.55, 0.95, 0.7, 0.95, 0.85],
  [0.95, 0.93, 0.75, 0.93, 0.75, 0.85],
  [0.75, 0.75, 0.7, 0.65, 0.7, 0.55],
  [0.7, 0.42, 0.65, 0.38, 0.5, 0.38],
  [0.35, 0.38, 0.3, 0.42, 0.3, 0.55],
  [0.3, 0.65, 0.25, 0.75, 0.25, 0.85],
  [0.25, 0.93, 0.05, 0.93, 0.05, 0.85],
  [0.05, 0.7, 0.05, 0.55, 0.15, 0.52],
  [0.15, 0.48, 0.18, 0.45, 0.18, 0.42],
  [0.18, 0.25, 0.28, 0.15, 0.5, 0.15]
]</textarea>
        </div>
    </div>

    <div class="preview-container">
        <div class="svg-wrapper">
            <!-- Viewbox is -2 to 34 to allow seeing edges of 0-32 grid -->
            <svg id="visualizer" viewBox="-2 -2 36 36">
                <!-- Underlay Image -->
                <image id="underlayImage" x="0" y="0" width="32" height="32" opacity="0.5"
                    preserveAspectRatio="xMidYMid meet" href="" style="display: none; pointer-events: none;" />
                <!-- Grid renders dynamically here -->
                <g id="gridLayer"></g>
                <!-- Diff Path Layer (underneath main path) -->
                <path id="diffPath" fill="none" stroke="var(--anchor)" stroke-width="0.3" stroke-linecap="round"
                    stroke-linejoin="round" stroke-dasharray="0.5 0.5" style="display: none; pointer-events: none;" />
                <!-- Main Path Overalys -->
                <path id="mainPath" fill="var(--accent-alpha)" stroke="var(--accent)" stroke-width="0.3"
                    stroke-linecap="round" stroke-linejoin="round" />
                <!-- Handles (lines connecting anchors and control points) -->
                <g id="handlesLayer" stroke="var(--control)" stroke-width="0.1" stroke-dasharray="0.2 0.4"></g>
                <!-- Anchor and control points -->
                <g id="pointsLayer"></g>
            </svg>
        </div>

        <div class="tools">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color bg-anchor"></div><span>Anchor</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color bg-control"></div><span>Control Point</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color bg-path"></div><span>Current Path</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color bg-diff"></div><span>Diff Checkpoint</span>
                </div>
            </div>

            <div
                style="display: flex; gap: 1.5rem; align-items: center; border-left: 1px solid var(--grid-major); padding-left: 1.5rem">
                <div style="display: flex; flex-direction: column; gap: 0.5rem">
                    <label class="btn" style="margin:0; text-align: center;">
                        Import Image
                        <input type="file" id="imageUpload" accept="image/*, .svg" style="display: none;">
                    </label>
                    <label style="display: flex; justify-content: space-between; font-size: 0.75rem;">
                        Opac
                        <input type="range" id="imageOpacity" min="0" max="100" value="50" style="width: 70px">
                    </label>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; width: 110px;">
                    <label style="display: flex; justify-content: space-between; align-items: center">
                        Scale <input type="range" id="imageScale" min="10" max="300" value="100" style="width: 70px">
                    </label>
                    <label style="display: flex; justify-content: space-between; align-items: center">
                        X <input type="range" id="imageX" min="-32" max="32" value="0" style="width: 70px">
                    </label>
                    <label style="display: flex; justify-content: space-between; align-items: center">
                        Y <input type="range" id="imageY" min="-32" max="32" value="0" style="width: 70px">
                    </label>
                </div>
            </div>

            <div style="margin-left: auto; display: flex; flex-direction: column; gap: 0.5rem; align-items: center;">
                <span style="font-size: 0.75rem;">32x32 Output:</span>
                <canvas id="faviconCanvas" width="32" height="32"
                    style="border: 1px solid var(--grid-major); border-radius: 4px; background: transparent; display: block;"></canvas>
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('codeEditor');
        const diffEditor = document.getElementById('diffEditor');
        const errorDisplay = document.getElementById('errorDisplay');
        const mainPath = document.getElementById('mainPath');
        const diffPath = document.getElementById('diffPath');
        const gridLayer = document.getElementById('gridLayer');
        const handlesLayer = document.getElementById('handlesLayer');
        const pointsLayer = document.getElementById('pointsLayer');
        const canvas = document.getElementById('faviconCanvas');
        const ctx = canvas.getContext('2d');
        const copyBtn = document.getElementById('copyBtn');
        const svg = document.getElementById('visualizer');
        const imageUpload = document.getElementById('imageUpload');
        const underlayImage = document.getElementById('underlayImage');
        const imageOpacity = document.getElementById('imageOpacity');
        const imageScale = document.getElementById('imageScale');
        const imageX = document.getElementById('imageX');
        const imageY = document.getElementById('imageY');

        const SIZE = 32;
        let currentData = [];

        // --- History / Checkpoints System ---
        let checkpoints = [];
        let activeDiffIndex = -1;
        const historyListItems = document.getElementById('historyListItems');

        function saveCheckpoint(reason = 'Manual Save') {
            const time = new Date().toLocaleTimeString();
            const textContent = editor.value;
            // Prevent exact duplication of latest state
            if (checkpoints.length > 0 && checkpoints[checkpoints.length - 1].text === textContent) {
                return;
            }
            // Safely deep clone data
            let clonedData = [];
            if (currentData && currentData.length) {
                clonedData = JSON.parse(JSON.stringify(currentData));
            }

            checkpoints.push({
                idx: checkpoints.length,
                time,
                reason,
                text: textContent,
                data: clonedData
            });
            renderHistory();
        }

        function renderHistory() {
            historyListItems.innerHTML = '';
            // Render reverse chronological
            [...checkpoints].reverse().forEach((cp) => {
                const d = document.createElement('div');
                d.className = 'history-item' + (activeDiffIndex === cp.idx ? ' active' : '');
                d.innerHTML = `
                    <div class="history-item-top">
                        <strong>${cp.reason}</strong>
                        <span class="history-item-time">${cp.time}</span>
                    </div>
                `;
                d.onclick = () => toggleDiff(cp.idx);
                historyListItems.appendChild(d);
            });
        }

        function toggleDiff(index) {
            if (activeDiffIndex === index) {
                // Disable diff mode
                activeDiffIndex = -1;
                diffEditor.style.display = 'none';
                diffPath.style.display = 'none';
            } else {
                // Enable diff mode
                activeDiffIndex = index;
                const cp = checkpoints[index];

                diffEditor.value = cp.text;
                diffEditor.style.display = 'block';

                drawDiffPath(cp.data);
            }
            renderHistory();
        }

        function drawDiffPath(data) {
            if (!data || !data.length) {
                diffPath.style.display = 'none';
                return;
            }
            let pData = '';
            const startX = data[0][0] * SIZE;
            const startY = data[0][1] * SIZE;
            pData += `M ${startX} ${startY} `;

            for (let i = 1; i < data.length; i++) {
                const seg = data[i];
                if (seg.length === 6) {
                    pData += `C ${seg[0] * SIZE} ${seg[1] * SIZE}, ${seg[2] * SIZE} ${seg[3] * SIZE}, ${seg[4] * SIZE} ${seg[5] * SIZE} `;
                }
            }

            diffPath.setAttribute('d', pData + ' Z');
            diffPath.style.display = 'block';
        }

        document.getElementById('addCheckpointBtn').addEventListener('click', () => saveCheckpoint('Manual Save'));

        // Sync scrolling for Textareas
        editor.addEventListener('scroll', () => { if (diffEditor.style.display !== 'none') diffEditor.scrollTop = editor.scrollTop; });
        diffEditor.addEventListener('scroll', () => { editor.scrollTop = diffEditor.scrollTop; });


        // --- Core Visualizer Logic ---

        function renderGrid() {
            let gridHTML = '';
            for (let i = 0; i <= SIZE; i++) {
                const isMajor = i % 8 === 0;
                const strokeColor = isMajor ? 'var(--grid-major)' : 'var(--grid-minor)';
                const strokeWidth = isMajor ? 0.2 : 0.1;
                gridHTML += `<line x1="${i}" y1="0" x2="${i}" y2="${SIZE}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
                gridHTML += `<line x1="0" y1="${i}" x2="${SIZE}" y2="${i}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />`;
            }
            gridLayer.innerHTML = gridHTML;
        }

        function createPoint(x, y, type, segIndex, valIndex) {
            const isAnchor = type === 'anchor';
            const color = isAnchor ? 'var(--anchor)' : 'var(--control)';
            const radius = isAnchor ? 0.5 : 0.4;
            return `<circle class="draggable" cx="${x * SIZE}" cy="${y * SIZE}" r="${radius}" fill="${color}" data-seg="${segIndex}" data-val="${valIndex}" />`;
        }

        function updateVisuals(data) {
            if (!Array.isArray(data) || data.length === 0) return;

            let pathData = '';
            let pointsHTML = '';
            let handlesHTML = '';

            const startX = data[0][0] * SIZE;
            const startY = data[0][1] * SIZE;
            pathData += `M ${startX} ${startY} `;
            pointsHTML += createPoint(data[0][0], data[0][1], 'anchor', 0, 0);

            let lastAnchorX = startX;
            let lastAnchorY = startY;

            for (let i = 1; i < data.length; i++) {
                const seg = data[i];
                if (seg.length === 6) {
                    const cp1x = seg[0] * SIZE;
                    const cp1y = seg[1] * SIZE;
                    const cp2x = seg[2] * SIZE;
                    const cp2y = seg[3] * SIZE;
                    const ax = seg[4] * SIZE;
                    const ay = seg[5] * SIZE;

                    pathData += `C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${ax} ${ay} `;

                    // Connection lines
                    handlesHTML += `<line x1="${lastAnchorX}" y1="${lastAnchorY}" x2="${cp1x}" y2="${cp1y}" />`;
                    handlesHTML += `<line x1="${cp2x}" y1="${cp2y}" x2="${ax}" y2="${ay}" />`;

                    // Dots
                    pointsHTML += createPoint(seg[0], seg[1], 'control', i, 0);
                    pointsHTML += createPoint(seg[2], seg[3], 'control', i, 2);
                    pointsHTML += createPoint(seg[4], seg[5], 'anchor', i, 4);

                    lastAnchorX = ax;
                    lastAnchorY = ay;
                }
            }

            mainPath.setAttribute('d', pathData + ' Z');
            handlesLayer.innerHTML = handlesHTML;
            pointsLayer.innerHTML = pointsHTML;

            // Render Output Canvas
            ctx.clearRect(0, 0, SIZE, SIZE);
            ctx.strokeStyle = '#f59e0b'; // Matching animator.js color
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            for (let i = 1; i < data.length; i++) {
                const seg = data[i];
                if (seg.length === 6) {
                    ctx.bezierCurveTo(
                        seg[0] * SIZE, seg[1] * SIZE,
                        seg[2] * SIZE, seg[3] * SIZE,
                        seg[4] * SIZE, seg[5] * SIZE
                    );
                }
            }
            ctx.closePath();
            ctx.stroke();
        }

        function updateTextArea(data) {
            let replacedCount = 0;
            const newText = editor.value.replace(/\[\s*(-?\d*\.?\d+(?:,\s*-?\d*\.?\d+)*)\s*\]/g, (match, innerText) => {
                if (replacedCount < data.length) {
                    const arrStr = data[replacedCount].map(v => Math.round(v * 1000) / 1000).join(', ');
                    replacedCount++;
                    return `[${arrStr}]`;
                }
                return match;
            });
            editor.value = newText;
        }

        function parseAndRender() {
            try {
                const val = editor.value;
                // Use JSON.parse instead of new Function for security (SEC-4)
                // We strip comments and trailing commas to be more user-friendly while remaining secure
                const cleanJson = val
                    .replace(/\/\/.*$/gm, '') // Remove single-line comments
                    .replace(/\/\*[\s\S]*?\*\//g, '') // Remove multi-line comments
                    .replace(/,(\s*[\]}])/g, '$1'); // Remove trailing commas

                const data = JSON.parse(cleanJson);
                currentData = data;

                updateVisuals(data);
                errorDisplay.textContent = '';
                editor.style.borderColor = 'var(--grid-major)';
            } catch (err) {
                errorDisplay.textContent = 'Invalid JSON array formulation.';
                editor.style.borderColor = 'var(--control)';
            }
        }

        // Debounced typing auto-save
        let typingTimer;
        editor.addEventListener('input', () => {
            parseAndRender();
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                saveCheckpoint('Typing End');
            }, 1000);
        });

        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(editor.value).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = originalText, 2000);
            });
        });

        // SVG Dragging Logic
        let activePoint = null;
        let pointerId = null;

        svg.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'circle') return;
            e.preventDefault();

            activePoint = {
                segIndex: parseInt(e.target.dataset.seg),
                xIdx: parseInt(e.target.dataset.val),
                yIdx: parseInt(e.target.dataset.val) + 1
            };
            pointerId = e.pointerId;
            svg.setPointerCapture(pointerId);
            svg.style.cursor = 'grabbing';

            // Un-snap current Diff while dragging so we can focus on latest path, 
            // but it's cool to leave it visible to see drag differences!
        });

        svg.addEventListener('pointermove', (e) => {
            if (!activePoint || !currentData.length) return;

            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;

            const ctm = svg.getScreenCTM();
            if (!ctm) return;
            const transformed = pt.matrixTransform(ctm.inverse());

            let valX = transformed.x / SIZE;
            let valY = transformed.y / SIZE;

            const step = e.shiftKey ? 0.05 : 0.01;

            valX = Math.round(Math.round(valX / step) * step * 1000) / 1000;
            valY = Math.round(Math.round(valY / step) * step * 1000) / 1000;

            currentData[activePoint.segIndex][activePoint.xIdx] = valX;
            currentData[activePoint.segIndex][activePoint.yIdx] = valY;

            updateVisuals(currentData);
            updateTextArea(currentData);
        });

        svg.addEventListener('pointerup', (e) => {
            if (activePoint) {
                svg.releasePointerCapture(pointerId);
                svg.style.cursor = 'default';
                activePoint = null;
                parseAndRender();
                saveCheckpoint('Drag Offset');
            }
        });

        // Image Underlay Logic
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                underlayImage.setAttribute('href', event.target.result);
                underlayImage.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        imageOpacity.addEventListener('input', (e) => {
            underlayImage.setAttribute('opacity', e.target.value / 100);
        });

        function updateImageTransform() {
            const scale = imageScale.value / 100;
            const x = imageX.value;
            const y = imageY.value;

            underlayImage.style.transformOrigin = '16px 16px';
            underlayImage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        }

        imageScale.addEventListener('input', updateImageTransform);
        imageX.addEventListener('input', updateImageTransform);
        imageY.addEventListener('input', updateImageTransform);

        // Init
        renderGrid();
        parseAndRender();
        saveCheckpoint('Initial State'); // Save base state immediately
    </script>
</body>

</html>
