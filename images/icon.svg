<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg-color: transparent;
      --stroke-color: oklch(from hsl(36, 92%, 52%) l c h); 
    }
    .main-circle {
      fill: none;
    }
    .accent-circle {
      fill: none;
      stroke: var(--stroke-color);
      stroke-width: 16; 
      stroke-linecap: round;
    }
  </style>
  <defs>
    <filter id="displacementFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        type="turbulence"
        baseFrequency="0.02"
        numOctaves="2"
        result="turbulence">
        <animate 
          begin="0s"
          attributeName="baseFrequency"
          values="0.02;0.04;0.02"
          dur="8s"
          repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap
        in="SourceGraphic"
        in2="turbulence"
        scale="20"
        xChannelSelector="R"
        yChannelSelector="G">
        <animate 
          begin="0s"
          attributeName="scale"
          values="20;40;20"
          dur="6s"
          repeatCount="indefinite" />
      </feDisplacementMap>
    </filter>
  </defs>
  <!-- Main circle defines the hit area if needed, but we keep it transparent as requested -->
  <circle class="main-circle" cx="64" cy="64" r="60" filter="url(#displacementFilter)"/>
  <!-- Accent circle with thick stroke to show the animation clearly -->
  <circle class="accent-circle" cx="64" cy="64" r="48" filter="url(#displacementFilter)"/>
</svg>